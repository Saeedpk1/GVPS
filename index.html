<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4b9e">
<title>Green Valley Public School – Fee Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#eef3fa;--card:#fff;--ink:#14233f;--muted:#5d6c86;--line:#dbe3ef;
  --pri:#1d4b9e;--pri2:#2f6fd6;--soft:#e4ecf9;
  --paid:#16804a;--paidbg:#e3f4ea;--part:#a86400;--partbg:#fdf0da;--due:#b8322a;--duebg:#fbe5e3;
  --hill1:#2f7d4c;--hill2:#5aa86f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1524;--card:#16213a;--ink:#e6ecf7;--muted:#9aa8c2;--line:#26324d;
  --pri:#24508f;--pri2:#6c9cf2;--soft:#1d2a47;
  --paid:#5cc98c;--paidbg:#123020;--part:#f0b04f;--partbg:#3a2a10;--due:#ff8076;--duebg:#3b1a19;
  --hill1:#1f5a37;--hill2:#2f7a4a;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

/* Header */
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 30px;overflow:hidden}
header .hrow{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
header h1{font-size:18px;font-weight:800;letter-spacing:.2px;line-height:1.2}
header p{font-size:13px;opacity:.85}
header .grow{flex:1;min-width:0}
.icon-btn{background:rgba(255,255,255,.14);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#fff}
.icon-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
header svg.valley{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:30px}
.test{background:var(--partbg);color:var(--part);font-size:13px;padding:8px 16px;font-weight:600}

/* Layout */
main{max-width:720px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 90px)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select{flex:1 1 140px;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px}
.filters input[type=search]{flex-basis:100%}
.sec{font-size:14px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}

/* Summary */
.summary{padding:16px}
.summary .lbl{font-size:13px;color:var(--muted)}
.summary .big{font-size:30px;font-weight:800;line-height:1.1;margin:2px 0}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:12px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hill1),var(--hill2));border-radius:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.grid4 b{display:block;font-size:17px;font-weight:800}
.grid4 span{font-size:12px;color:var(--muted)}
.c-paid{color:var(--paid)}.c-due{color:var(--due)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:700;padding:0 16px;height:44px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
.btn.wide{width:100%;margin-top:12px;height:50px;font-size:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.green{background:#1a9b55}
.btn.red{background:var(--duebg);color:var(--due)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.addrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.addrow b{font-size:16px}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.item:focus-visible{outline:2px solid var(--pri2)}
.item .t{flex:1;min-width:0}
.item .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .amt{font-weight:800}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.paid,.chip.free{background:var(--paidbg);color:var(--paid)}
.chip.part{background:var(--partbg);color:var(--part)}
.chip.due,.chip.left{background:var(--duebg);color:var(--due)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:10px;background:var(--duebg);color:var(--due);border-radius:12px;font-weight:700}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
nav button.on{color:var(--pri2)}
nav svg{width:24px;height:24px}

/* Sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.45);display:none;align-items:flex-end;justify-content:center}
#sheetWrap.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:2px}
.sheet label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.sheet input,.sheet select,.sheet textarea{display:block;width:100%;margin-top:4px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;font-weight:400;color:var(--ink)}
.sheet textarea{height:auto;padding:10px 12px;min-height:110px}
.sheet label.check{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:600}
.sheet label.check input{width:22px;height:22px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.actions .btn{flex:1 1 120px}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
.info dt{color:var(--muted)}.info dd{font-weight:600;margin:0}
details{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
summary{padding:12px 0;font-weight:700;cursor:pointer}
details .list{padding-bottom:12px}
.err{color:var(--due);font-size:14px;margin-top:10px;min-height:20px}
.note{font-size:13px;color:var(--muted);margin-top:6px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* Receipt */
.receipt{border:1.5px dashed var(--line);border-radius:12px;padding:16px}
.r-head{text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.r-head b{display:block;font-size:17px}
.r-head span{display:block;font-size:13px;color:var(--muted)}
.r-head .r-title{margin-top:6px;font-weight:800;color:var(--pri2);font-size:14px}
.receipt table{width:100%;border-collapse:collapse;font-size:14px}
.receipt td{padding:5px 0;vertical-align:top}
.receipt td:last-child{text-align:right;font-weight:700}
.receipt tr.paidrow td{font-size:17px;border-top:1px solid var(--line);padding-top:9px;color:var(--paid)}

/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--pri)}
.login-card{background:var(--card);border-radius:18px;padding:24px 20px;width:100%;max-width:380px}
.login-card h1{font-size:21px;font-weight:800}
.login-card label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:14px}
.login-card input{display:block;width:100%;margin-top:4px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}

@media print{
  body{background:#fff}
  #app,#login,nav,header,.no-print,#toast{display:none!important}
  #sheetWrap{position:static;display:block!important;background:none}
  .sheet{max-height:none;box-shadow:none;animation:none;padding:0}
  .receipt{border-color:#999}
}
</style>
</head>
<body>

<!-- ============================================================
  FIREBASE SETTINGS
  Leave apiKey empty to test on this phone only (Test mode).
  Paste your Firebase web config here to put the app online.
============================================================= -->
<script>
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
</script>

<div id="login" hidden>
  <div class="login-card">
    <h1 id="l_school">Green Valley Public School</h1>
    <p class="muted">Admin sign in</p>
    <label>Email<input id="l_email" type="email" autocomplete="username"></label>
    <label>Password<input id="l_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
    <button class="btn wide" onclick="doLogin()">Sign in</button>
    <p id="l_err" class="err"></p>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hrow">
      <div class="grow">
        <h1 id="h_school">Green Valley Public School</h1>
        <p id="h_place">Parrai, Swat</p>
      </div>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <svg class="valley" viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 30 L0 18 C60 4 110 6 170 16 C220 24 260 8 320 6 C360 5 385 12 400 16 L400 30 Z" fill="var(--hill2)"/>
      <path d="M0 30 L0 24 C70 14 130 26 200 22 C270 18 330 12 400 22 L400 30 Z" fill="var(--hill1)"/>
      <path d="M0 30 L0 28 L400 28 L400 30 Z" fill="var(--bg)"/>
    </svg>
  </header>
  <div id="testBar" class="test" hidden>Test mode: data is saved on this phone only. Add Firebase settings to go online.</div>
  <main id="main"></main>
  <nav>
    <button data-tab="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="students" onclick="go('students')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.8 3 2.6 3.5 5.2"/></svg>Students</button>
    <button data-tab="collect" onclick="go('collect')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M7 15h3"/></svg>Collect</button>
    <button data-tab="dues" onclick="go('dues')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Dues</button>
  </nav>
</div>

<div id="sheetWrap" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
/* ---------- Basics ---------- */
const ONLINE = !!firebaseConfig.apiKey;
const LKEY = 'gvps-fee-data';
const DEFAULTS = {
  school:'Green Valley Public School', place:'Parrai, Swat', phone:'',
  classes:['Playgroup','Nursery','Prep','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10']
};
let S = {students:[], payments:[], settings:{...DEFAULTS}};
let UI = {tab:'home', month:thisMonth(), cls:'', q:''};
let fs=null, auth=null, unsubs=[], filler=null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => 'Rs ' + Math.round(Number(n||0)).toLocaleString('en-PK');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function thisMonth(){return todayStr().slice(0,7);}
function monthName(m){if(!m)return'';const [y,mm]=m.split('-');return new Date(+y,+mm-1,1).toLocaleString('en',{month:'long',year:'numeric'});}
function niceDate(d){if(!d)return'';const [y,m,dd]=d.split('-');return new Date(+y,+m-1,+dd).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='92'+d.slice(1);else if(d.length===10&&d.startsWith('3'))d='92'+d;return d;}
function waLink(phone,msg){return 'https://wa.me/'+waNum(phone)+'?text='+encodeURIComponent(msg);}
const classes = () => (S.settings.classes&&S.settings.classes.length)?S.settings.classes:DEFAULTS.classes;
const getS = id => S.students.find(s=>s.id===id);
const isActive = s => s.active!==false;

/* ---------- Data layer (Firebase online, or this phone in Test mode) ---------- */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LKEY)||'null');if(d){S.students=d.students||[];S.payments=d.payments||[];S.settings={...DEFAULTS,...(d.settings||{})};}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S));}catch(e){toast('Could not save on this phone');}}
function fail(e){console.error(e);toast('Not saved: '+(e&&e.message?e.message:'check internet'));}
function clean(o){const c={...o};delete c.id;return c;}
function add(col,o){
  if(ONLINE){fs.collection(col).add(clean(o)).catch(fail);}
  else{o.id=uid();S[col].push(o);saveLocal();render();}
}
function upd(col,id,o){
  if(ONLINE){fs.collection(col).doc(id).update(clean(o)).catch(fail);}
  else{Object.assign(S[col].find(x=>x.id===id)||{},o);saveLocal();render();}
}
function del(col,id){
  if(ONLINE){fs.collection(col).doc(id).delete().catch(fail);}
  else{S[col]=S[col].filter(x=>x.id!==id);saveLocal();render();}
}
function saveSettingsData(o){
  if(ONLINE){fs.doc('settings/main').set(o,{merge:true}).catch(fail);}
  else{S.settings={...S.settings,...o};saveLocal();render();}
}
function listen(){
  const map = sn => sn.docs.map(d=>({id:d.id,...d.data()}));
  unsubs.push(fs.collection('students').onSnapshot(sn=>{S.students=map(sn);render();},fail));
  unsubs.push(fs.collection('payments').onSnapshot(sn=>{S.payments=map(sn);render();},fail));
  unsubs.push(fs.doc('settings/main').onSnapshot(d=>{S.settings={...DEFAULTS,...(d.exists?d.data():{})};render();},fail));
}

/* ---------- Fee logic ---------- */
function paidFor(sid,m){return S.payments.filter(p=>p.studentId===sid&&p.month===m).reduce((a,p)=>a+Number(p.amount||0),0);}
function status(s,m){
  const fee=Number(s.fee||0), paid=paidFor(s.id,m);
  if(fee<=0) return {k:'free',t:'Free',paid,due:0};
  if(paid>=fee) return {k:'paid',t:'Paid',paid,due:0};
  if(paid>0) return {k:'part',t:'Part paid',paid,due:fee-paid};
  return {k:'due',t:'Not paid',paid,due:fee};
}
function sortStudents(a,b){
  const c=classes(), ia=c.indexOf(a.cls), ib=c.indexOf(b.cls);
  if(ia!==ib) return (ia<0?999:ia)-(ib<0?999:ib);
  const ra=parseInt(a.roll)||9999, rb=parseInt(b.roll)||9999;
  return ra-rb || String(a.name).localeCompare(b.name);
}
function matches(s){
  if(UI.cls && s.cls!==UI.cls) return false;
  const q=UI.q.trim().toLowerCase();
  if(!q) return true;
  return [s.name,s.father,s.roll,s.phone].some(v=>String(v||'').toLowerCase().includes(q));
}
function nextReceipt(){return S.payments.reduce((m,p)=>Math.max(m,Number(p.receiptNo)||0),0)+1;}

/* ---------- Shared UI ---------- */
function bar(o){
  return `<div class="filters">
  ${o.month?`<input type="month" aria-label="Month" value="${UI.month}" onchange="UI.month=this.value||thisMonth();render()">`:''}
  ${o.cls?`<select aria-label="Class" onchange="UI.cls=this.value;render()"><option value="">All classes</option>${classes().map(c=>`<option ${c===UI.cls?'selected':''}>${esc(c)}</option>`).join('')}</select>`:''}
  ${o.q?`<input type="search" placeholder="Search name, father, roll no or phone" value="${esc(UI.q)}" oninput="UI.q=this.value;fillList()">`:''}
  </div>`;
}
function fillList(){if(filler)filler();}
function go(t){UI.tab=t;UI.q='';render();window.scrollTo(0,0);}
function sheet(h){$('#sheetBody').innerHTML=h;$('#sheetWrap').classList.add('open');}
function closeSheet(){$('#sheetWrap').classList.remove('open');}
function sline(s){return `${esc(s.cls)}${s.roll?', Roll '+esc(s.roll):''}${s.father?', Father: '+esc(s.father):''}`;}

function render(){
  $('#h_school').textContent=S.settings.school;
  $('#h_place').textContent=S.settings.place;
  document.title=S.settings.school+' – Fee Admin';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  filler=null;
  ({home:viewHome,students:viewStudents,collect:viewCollect,dues:viewDues})[UI.tab]();
}

/* ---------- Home ---------- */
function viewHome(){
  const m=UI.month, act=S.students.filter(isActive);
  let exp=0,pend=0,paidN=0,dueN=0;
  act.forEach(s=>{const st=status(s,m);exp+=Number(s.fee||0);pend+=st.due;(st.due>0?dueN++:paidN++);});
  const col=S.payments.filter(p=>p.month===m).reduce((a,p)=>a+Number(p.amount||0),0);
  const todayAmt=S.payments.filter(p=>p.date===todayStr()).reduce((a,p)=>a+Number(p.amount||0),0);
  const pct=exp?Math.min(100,Math.round((exp-pend)/exp*100)):0;
  const recent=[...S.payments].sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,8);
  $('#main').innerHTML=`
  ${bar({month:true})}
  <section class="card summary">
    <div class="lbl">Collected for ${monthName(m)}</div>
    <div class="big">${rs(col)}</div>
    <div class="lbl">${rs(pend)} still to collect, out of ${rs(exp)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="grid4">
      <div><b>${act.length}</b><span>Students</span></div>
      <div><b class="c-paid">${paidN}</b><span>Paid</span></div>
      <div><b class="c-due">${dueN}</b><span>Not paid</span></div>
      <div><b>${todayAmt?Math.round(todayAmt/1000*10)/10+'k':'0'}</b><span>Today</span></div>
    </div>
  </section>
  <button class="btn wide" onclick="go('collect')">Collect fee</button>
  <h3 class="sec">Latest receipts</h3>
  <div class="list">${recent.length?recent.map(p=>`
    <button class="item" onclick="showReceipt('${p.id}',true)">
      <div class="t"><div class="n">${esc(p.name)}</div><div class="s">#${p.receiptNo}, ${esc(p.cls)}, ${monthName(p.month)}</div></div>
      <div class="r"><span class="amt">${rs(p.amount)}</span><span class="s">${niceDate(p.date)}</span></div>
    </button>`).join(''):`<div class="empty card">No fee collected yet.${S.students.length?'':`<br><button class="btn" onclick="openStudentForm()">Add first student</button>`}</div>`}
  </div>`;
}

/* ---------- Students ---------- */
function viewStudents(){
  $('#main').innerHTML=`<div class="addrow"><b>${S.students.filter(isActive).length} students</b><button class="btn sm" onclick="openStudentForm()">+ Add student</button></div>
  ${bar({cls:true,q:true})}<div class="list" id="list"></div>`;
  filler=()=>{
    const l=S.students.filter(matches).sort(sortStudents);
    $('#list').innerHTML=l.length?l.map(s=>`
      <button class="item" onclick="openStudent('${s.id}')">
        <div class="t"><div class="n">${esc(s.name)}</div><div class="s">${sline(s)}</div></div>
        <div class="r"><span class="amt">${rs(s.fee)}</span>${isActive(s)?'':'<span class="chip left">Left</span>'}</div>
      </button>`).join(''):`<div class="empty card">${S.students.length?'No student matches this search.':'No students yet.<br><button class="btn" onclick="openStudentForm()">Add first student</button>'}</div>`;
  };
  fillList();
}
function openStudentForm(id){
  const s=id?getS(id):{name:'',father:'',cls:UI.cls||classes()[0],roll:'',phone:'',fee:'',admit:todayStr(),active:true};
  const cl=classes().includes(s.cls)?classes():[...classes(),s.cls];
  sheet(`<h3>${id?'Edit student':'Add student'}</h3>
  <label>Student name<input id="f_name" value="${esc(s.name)}"></label>
  <label>Father name<input id="f_father" value="${esc(s.father)}"></label>
  <div class="two">
    <label>Class<select id="f_cls">${cl.map(c=>`<option ${c===s.cls?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    <label>Roll no<input id="f_roll" inputmode="numeric" value="${esc(s.roll)}"></label>
  </div>
  <label>Parent phone (WhatsApp)<input id="f_phone" type="tel" placeholder="03xx xxxxxxx" value="${esc(s.phone)}"></label>
  <div class="two">
    <label>Monthly fee (Rs)<input id="f_fee" type="number" inputmode="numeric" min="0" value="${esc(s.fee)}"></label>
    <label>Admission date<input id="f_admit" type="date" value="${esc(s.admit)}"></label>
  </div>
  <p class="note">Put 0 as fee for students who study free.</p>
  ${id?`<label class="check"><input type="checkbox" id="f_active" ${isActive(s)?'checked':''}> Still studying here</label>`:''}
  <p id="f_err" class="err"></p>
  <div class="actions"><button class="btn ghost" onclick="${id?`openStudent('${id}')`:'closeSheet()'}">Cancel</button><button class="btn" onclick="saveStudent('${id||''}')">Save student</button></div>`);
  setTimeout(()=>$('#f_name').focus(),50);
}
function saveStudent(id){
  const o={name:$('#f_name').value.trim(),father:$('#f_father').value.trim(),cls:$('#f_cls').value,roll:$('#f_roll').value.trim(),
    phone:$('#f_phone').value.trim(),fee:Number($('#f_fee').value||0),admit:$('#f_admit').value};
  if(!o.name){$('#f_err').textContent='Enter the student name.';return;}
  if(o.fee<0){$('#f_err').textContent='Fee cannot be less than 0.';return;}
  if(id){o.active=$('#f_active').checked;upd('students',id,o);toast('Student saved');closeSheet();}
  else{o.active=true;o.created=Date.now();add('students',o);toast('Student added');openStudentForm();$('#f_err').textContent='Saved. Add the next student or tap Cancel.';$('#f_err').style.color='var(--paid)';}
}
function openStudent(id){
  const s=getS(id);if(!s){closeSheet();return;}
  const st=status(s,UI.month);
  const pays=S.payments.filter(p=>p.studentId===id).sort((a,b)=>(b.month+b.date).localeCompare(a.month+a.date));
  const total=pays.reduce((a,p)=>a+Number(p.amount||0),0);
  sheet(`<h3>${esc(s.name)}</h3><p class="muted">${esc(s.cls)}${isActive(s)?'':', left school'}</p>
  <dl class="info">
    <dt>Father</dt><dd>${esc(s.father)||'–'}</dd>
    <dt>Roll no</dt><dd>${esc(s.roll)||'–'}</dd>
    <dt>Phone</dt><dd>${s.phone?`<a href="tel:${esc(s.phone)}">${esc(s.phone)}</a>`:'–'}</dd>
    <dt>Monthly fee</dt><dd>${rs(s.fee)}</dd>
    <dt>Admitted</dt><dd>${niceDate(s.admit)||'–'}</dd>
    <dt>${monthName(UI.month)}</dt><dd><span class="chip ${st.k}">${st.t}</span>${st.due?' '+rs(st.due)+' left':''}</dd>
  </dl>
  <div class="actions">
    ${st.due>0?`<button class="btn green" onclick="openCollect('${id}')">Collect fee</button>`:''}
    ${st.due>0&&s.phone?`<a class="btn ghost" target="_blank" rel="noopener" href="${remindLink(s,st)}">Remind on WhatsApp</a>`:''}
    <button class="btn ghost" onclick="openStudentForm('${id}')">Edit</button>
  </div>
  <details ${pays.length?'open':''}><summary>Payment history (${pays.length}), total ${rs(total)}</summary>
    <div class="list">${pays.map(p=>`<button class="item" onclick="showReceipt('${p.id}',true)">
      <div class="t"><div class="n">${monthName(p.month)}</div><div class="s">#${p.receiptNo}, paid ${niceDate(p.date)}</div></div>
      <div class="r"><span class="amt">${rs(p.amount)}</span></div></button>`).join('')||'<p class="muted">No payments yet.</p>'}</div>
  </details>
  <div class="actions"><button class="btn red" onclick="deleteStudent('${id}')">Delete student</button><button class="btn ghost" onclick="closeSheet()">Close</button></div>`);
}
function deleteStudent(id){
  const s=getS(id);
  if(!confirm(`Delete ${s.name}? Their fee receipts will stay in records. To keep them in the list, use Edit and untick "Still studying here" instead.`))return;
  del('students',id);closeSheet();toast('Student deleted');
}

/* ---------- Collect ---------- */
function viewCollect(){
  $('#main').innerHTML=`${bar({month:true,cls:true,q:true})}<div class="list" id="list"></div>`;
  filler=()=>{
    const l=S.students.filter(s=>isActive(s)&&matches(s)).sort(sortStudents);
    $('#list').innerHTML=l.length?l.map(s=>{const st=status(s,UI.month);return `
      <button class="item" onclick="${st.due>0?`openCollect('${s.id}')`:`openStudent('${s.id}')`}">
        <div class="t"><div class="n">${esc(s.name)}</div><div class="s">${sline(s)}</div></div>
        <div class="r"><span class="chip ${st.k}">${st.t}</span><span class="s">${st.due>0?rs(st.due)+' due':rs(st.paid)}</span></div>
      </button>`;}).join(''):`<div class="empty card">${S.students.length?'No student matches.':'Add students first.<br><button class="btn" onclick="openStudentForm()">Add student</button>'}</div>`;
  };
  fillList();
}
function openCollect(id){
  const s=getS(id), st=status(s,UI.month);
  sheet(`<h3>Collect fee</h3><p class="muted">${esc(s.name)}, ${sline(s)}</p>
  <div class="two">
    <label>Fee month<input id="c_month" type="month" value="${UI.month}" onchange="updDue('${id}')"></label>
    <label>Date paid<input id="c_date" type="date" value="${todayStr()}"></label>
  </div>
  <label>Amount received (Rs)<input id="c_amt" type="number" inputmode="numeric" min="1" value="${st.due||s.fee||''}"></label>
  <p class="note" id="c_info">Monthly fee ${rs(s.fee)}${st.paid?`, already paid ${rs(st.paid)}`:''}.</p>
  <label>Note (optional)<input id="c_note" placeholder="e.g. paid by uncle, discount"></label>
  <p id="c_err" class="err"></p>
  <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn green" onclick="savePayment('${id}')">Save and make receipt</button></div>`);
}
function updDue(id){
  const s=getS(id), m=$('#c_month').value||UI.month, st=status(s,m);
  $('#c_amt').value=st.due||'';
  $('#c_info').textContent=`Monthly fee ${rs(s.fee)}${st.paid?`, already paid ${rs(st.paid)}`:''}${st.due?'':'. This month is fully paid.'}`;
}
function savePayment(id){
  const s=getS(id), amt=Number($('#c_amt').value||0), m=$('#c_month').value;
  if(!m){$('#c_err').textContent='Pick the fee month.';return;}
  if(amt<=0){$('#c_err').textContent='Enter the amount received.';return;}
  const before=paidFor(id,m);
  const p={studentId:id,name:s.name,father:s.father||'',cls:s.cls,roll:s.roll||'',month:m,amount:amt,date:$('#c_date').value||todayStr(),
    note:$('#c_note').value.trim(),receiptNo:nextReceipt(),fee:Number(s.fee||0),balance:Math.max(0,Number(s.fee||0)-before-amt),created:Date.now()};
  add('payments',p);toast('Fee saved');showReceipt(p,false);
}

/* ---------- Receipt ---------- */
function showReceipt(pOrId,fromHistory){
  const p=typeof pOrId==='string'?S.payments.find(x=>x.id===pOrId):pOrId;if(!p)return;
  const s=getS(p.studentId)||{}, set=S.settings;
  const msg=`${set.school}\nFee receipt #${p.receiptNo}\nStudent: ${p.name} (${p.cls})\nMonth: ${monthName(p.month)}\nPaid: ${rs(p.amount)}\nBalance: ${rs(p.balance)}\nDate: ${niceDate(p.date)}\nShukriya.`;
  sheet(`<div class="receipt">
    <div class="r-head"><b>${esc(set.school)}</b><span>${esc(set.place)}${set.phone?', '+esc(set.phone):''}</span><span class="r-title">Fee receipt #${p.receiptNo}</span></div>
    <table>
      <tr><td>Date</td><td>${niceDate(p.date)}</td></tr>
      <tr><td>Student</td><td>${esc(p.name)}</td></tr>
      ${p.father?`<tr><td>Father</td><td>${esc(p.father)}</td></tr>`:''}
      <tr><td>Class</td><td>${esc(p.cls)}${p.roll?', Roll '+esc(p.roll):''}</td></tr>
      <tr><td>Fee month</td><td>${monthName(p.month)}</td></tr>
      <tr><td>Monthly fee</td><td>${rs(p.fee)}</td></tr>
      <tr><td>Balance for month</td><td>${rs(p.balance)}</td></tr>
      ${p.note?`<tr><td>Note</td><td>${esc(p.note)}</td></tr>`:''}
      <tr class="paidrow"><td>Amount paid</td><td>${rs(p.amount)}</td></tr>
    </table>
  </div>
  <div class="actions no-print">
    ${s.phone?`<a class="btn green" target="_blank" rel="noopener" href="${waLink(s.phone,msg)}">Send on WhatsApp</a>`:''}
    <button class="btn ghost" onclick="window.print()">Print</button>
    <button class="btn ghost" onclick="closeSheet()">Done</button>
  </div>
  ${fromHistory&&p.id?`<div class="actions no-print"><button class="btn red" onclick="deletePayment('${p.id}')">Delete this receipt</button></div>`:''}`);
}
function deletePayment(id){
  const p=S.payments.find(x=>x.id===id);
  if(!confirm(`Delete receipt #${p.receiptNo} for ${p.name} (${rs(p.amount)})? This fee will show as not paid again.`))return;
  del('payments',id);closeSheet();toast('Receipt deleted');
}

/* ---------- Dues ---------- */
function remindLink(s,st){
  const msg=`Assalam o Alaikum. ${s.name} (${s.cls}) ki ${monthName(UI.month)} ki fee ${rs(st.due)} baqi hai. Meharbani karke jaldi jama karwa dein.\n${S.settings.school}`;
  return waLink(s.phone,msg);
}
function viewDues(){
  $('#main').innerHTML=`${bar({month:true,cls:true})}<div id="list"></div>`;
  const l=S.students.filter(s=>isActive(s)&&matches(s)).map(s=>({s,st:status(s,UI.month)})).filter(x=>x.st.due>0).sort((a,b)=>sortStudents(a.s,b.s));
  const tot=l.reduce((a,x)=>a+x.st.due,0);
  $('#list').innerHTML=l.length?`<div class="total"><span>${l.length} students not paid</span><span>${rs(tot)}</span></div>
  <div class="list">${l.map(({s,st})=>`
    <div class="item">
      <div class="t" onclick="openStudent('${s.id}')"><div class="n">${esc(s.name)}</div><div class="s">${esc(s.cls)}${s.phone?', '+esc(s.phone):', no phone'}</div></div>
      <div class="r"><span class="amt c-due">${rs(st.due)}</span>
        <span style="display:flex;gap:6px">${s.phone?`<a class="btn sm ghost" target="_blank" rel="noopener" href="${remindLink(s,st)}">Remind</a>`:''}<button class="btn sm" onclick="openCollect('${s.id}')">Collect</button></span>
      </div>
    </div>`).join('')}</div>`
  :`<div class="empty card">${S.students.length?`Everyone has paid for ${monthName(UI.month)}.`:'Add students first.'}</div>`;
}

/* ---------- Settings ---------- */
function openSettings(){
  const set=S.settings;
  sheet(`<h3>Settings</h3>
  <label>School name<input id="s_school" value="${esc(set.school)}"></label>
  <label>Address<input id="s_place" value="${esc(set.place)}"></label>
  <label>School phone (shown on receipts)<input id="s_phone" type="tel" value="${esc(set.phone)}"></label>
  <label>Classes (one per line)<textarea id="s_classes">${esc(classes().join('\n'))}</textarea></label>
  <div class="actions"><button class="btn" onclick="saveSettings()">Save settings</button></div>
  <hr>
  <b>Records</b>
  <div class="actions">
    <button class="btn ghost" onclick="exportCSV()">Download receipts (Excel CSV)</button>
    <button class="btn ghost" onclick="backup()">Download backup</button>
  </div>
  ${ONLINE?`<hr><p class="note">Online. Signed in as ${esc(auth.currentUser&&auth.currentUser.email)}</p><div class="actions"><button class="btn red" onclick="auth.signOut();closeSheet()">Sign out</button></div>`
  :`<div class="actions"><label class="btn ghost" style="margin:0;color:var(--ink)">Restore backup<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div>
    <p class="note">Test mode: records stay on this phone. Add your Firebase settings in the file to share records between phones.</p>`}
  <div class="actions"><button class="btn ghost" onclick="closeSheet()">Close</button></div>`);
}
function saveSettings(){
  const cl=$('#s_classes').value.split('\n').map(x=>x.trim()).filter(Boolean);
  saveSettingsData({school:$('#s_school').value.trim()||DEFAULTS.school,place:$('#s_place').value.trim(),phone:$('#s_phone').value.trim(),classes:cl.length?cl:DEFAULTS.classes});
  toast('Settings saved');closeSheet();
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function backup(){download('gvps-backup-'+todayStr()+'.json',JSON.stringify({students:S.students,payments:S.payments,settings:S.settings}),'application/json');}
function exportCSV(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Receipt','Date','Student','Father','Class','Roll','Month','Amount','Balance','Note']]
    .concat([...S.payments].sort((a,b)=>(a.receiptNo||0)-(b.receiptNo||0)).map(p=>[p.receiptNo,p.date,p.name,p.father,p.cls,p.roll,p.month,p.amount,p.balance,p.note]));
  download('gvps-receipts-'+todayStr()+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function restore(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Replace all records on this phone with this backup?'))return;
    S.students=d.students||[];S.payments=d.payments||[];S.settings={...DEFAULTS,...(d.settings||{})};saveLocal();render();closeSheet();toast('Backup restored');}
    catch(e){toast('This file is not a valid backup');}};
  r.readAsText(f);
}

/* ---------- Login and start ---------- */
function doLogin(){
  $('#l_err').textContent='';
  auth.signInWithEmailAndPassword($('#l_email').value.trim(),$('#l_pass').value)
    .catch(e=>{$('#l_err').textContent=/network/i.test(e.code||'')?'No internet. Check connection and try again.':'Wrong email or password.';});
}
function showApp(){$('#login').hidden=true;$('#app').hidden=false;render();}
function boot(){
  if(!ONLINE){loadLocal();$('#testBar').hidden=false;showApp();return;}
  if(typeof firebase==='undefined'){document.body.innerHTML='<p style="padding:24px">Could not load. Check internet and reload the page.</p>';return;}
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
  auth.onAuthStateChanged(u=>{
    unsubs.forEach(f=>f());unsubs=[];
    if(!u){$('#app').hidden=true;$('#login').hidden=false;closeSheet();return;}
    showApp();listen();
  });
}
boot();
</script>
</body>
</html>
