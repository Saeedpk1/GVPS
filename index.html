function loadScript(src,glob){if(window[glob])return Promise.resolve(window[glob]);return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res(window[glob]);s.onerror=()=>rej(new Error('Could not load. Check internet.'));document.head.appendChild(s);});}
async function certPdf(send){
  const s=getS(UI.cstu), T=CT(UI.ctype);
  toast('Making PDF...');
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas');
    await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','jspdf');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;';host.innerHTML=certHtml(UI.ctype,UI.cdata);document.body.appendChild(host);
    const canvas=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#fffdf7',useCORS:true});
    host.remove();
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    const fname=`${T[1]} - ${(s.name||'student').replace(/[^a-z0-9 ]/gi,'')}.pdf`;
    const blob=pdf.output('blob');
    certLog();
    const file=new File([blob],fname,{type:'application/pdf'});
    if(send&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:T[1],text:`${T[1]} of ${s.name}, ${S.settings.school}`}).catch(()=>{});
      return;
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
    if(send){toast('PDF saved. Attach it in WhatsApp.');if(s.phone)setTimeout(()=>window.open(waLink(s.phone,`Assalam o Alaikum. ${T[1]} of ${s.name} from ${S.settings.school} is attached.`),'_blank'),900);}
    else toast('PDF saved to your phone');
  }catch(e){toast('Could not make PDF: '+(e.message||e));}
}


/* ================= Old months fee: colourful table ================= */
/* Works like the paper register: each cell is the money paid in that month.
   Tap an empty month: it fills the fee still owed up to that month (one month, or more if earlier months were missed).
   Tap a filled month: type a different amount (0 removes it). Grey months are before fee was counted: tapping one starts the fee from there. */
let OF=null;
const lastDay=m=>{const [y,mo]=m.split('-').map(Number);return todayStr(new Date(y,mo,0));};
const midDay=m=>m+'-10';
function monthsFrom(a,b){const out=[];for(let m=a;m<=b;m=nextM(m))out.push(m);return out;}
function openOldFee(g){
  const gs=isOwner()?allGroups(UI.camp).filter(x=>classStudents(x).length):myClasses();
  if(!gs.length){toast('No students yet');return;}
  g=g&&gs.includes(g)?g:(UI.cls&&gs.includes(UI.cls)?UI.cls:gs[0]);
  const y=Number(thisMonth().slice(0,4));OF={g,year:y,view:'month',month:y+'-01'<=thisMonth()?y+'-01':thisMonth(),pend:[],rem:new Set(),fees:{},from:{},open:{},edit:''};
  closeSheet();go('oldfee');
}
/* show the table as if the not-yet-saved changes were already saved */
function ofSim(fn){
  const real=S.payments, realSt=S.students;
  S.payments=real.filter(p=>!OF.rem.has(p.id)).concat(OF.pend);
  OF.open=OF.open||{};
  if(Object.keys(OF.fees).length||Object.keys(OF.from).length||Object.keys(OF.open).length)S.students=realSt.map(s=>{let o=s;
    if(OF.fees[s.id]!==undefined)o={...o,fee:OF.fees[s.id],disc:0,fees:[{from:'0000-00',fee:OF.fees[s.id],disc:0}]};
    if(OF.from[s.id])o={...o,feeFrom:OF.from[s.id]};
    if(OF.open[s.id]!==undefined)o={...o,opening:OF.open[s.id]};return o;});
  C={};try{return fn();}finally{S.payments=real;S.students=realSt;C={};}
}
function ofCell(s,m){
  const now=thisMonth(), am=monthOf(s.admit);
  if(m>now)return {k:'fut'};
  if(s.leftMonth&&m>s.leftMonth)return {k:'na'};
  const L=ledger(s,now);
  const cash=sum(paysOf(s.id).filter(p=>monthOf(p.date)===m),'amount');
  if(m<L.start)return {k:'pre',cash};
  const its=L.items.filter(i=>i.m===m), a=sum(its,'amt'), pd=sum(its,'paid');
  if(a<=0)return {k:'f',cash};
  return {k:pd>=a?'p':pd>0?'h':'d',a,pd,cash};
}
function viewOldFee(){
  if(!OF){openOldFee();return;}
  if(OF.view==='month'){viewOldFeeMonth();return;}
  const gs=isOwner()?allGroups(UI.camp).filter(x=>classStudents(x).length):myClasses();
  const g=OF.g, y=OF.year, months=[...Array(12)].map((_,i)=>y+'-'+String(i+1).padStart(2,'0'));
  const now=thisMonth(), cf=classFee(gCls(g));
  const years=[];for(let k=Number(now.slice(0,4));k>=Number(now.slice(0,4))-4;k--)years.push(k);
  const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pendN=OF.pend.length+OF.rem.size+Object.keys(OF.fees).length+Object.keys(OF.from).length;
  const fmt=n=>Math.round(n).toLocaleString('en-PK');
  const body=ofSim(()=>{
    const tot=Array(12).fill(0);let due=0;
    const rows=classStudents(g).map((s,k)=>{
      const fee=feeAt(s,now), L=ledger(s,now);due+=Math.max(0,L.bal);
      const cells=months.map((m,i)=>{const c=ofCell(s,m);
        if(c.k==='fut')return `<td><span class="ofc x"></span></td>`;
        if(c.k==='na')return `<td><span class="ofc x">–</span></td>`;
        tot[i]+=c.cash||0;
        if(c.k==='pre')return `<td><button class="ofc pre" onclick="ofTap('${s.id}','${m}')" aria-label="${esc(s.name)} ${MN[i]}, not counted">${c.cash?fmt(c.cash):'+'}</button></td>`;
        if(c.k==='f')return `<td><span class="ofc f">Free</span></td>`;
        const txt=c.cash?fmt(c.cash):c.k==='p'?'✓':c.k==='h'?fmt(c.pd):'';
        const k2=c.cash&&c.k==='d'?'h':c.k;
        return `<td><button class="ofc ${k2}${c.cash?' cash':''}" onclick="ofTap('${s.id}','${m}')" aria-label="${esc(s.name)} ${MN[i]}">${txt}</button></td>`;});
      const ed=OF.edit===s.id;
      return `<tr class="or${k%5}"><td class="on"><div><span class="oav">${esc(initials(s.name))}</span><b>${esc(s.name)}</b></div></td>
        <td class="of">${ed?`<input type="number" inputmode="numeric" id="ofFee" value="${fee}" aria-label="Monthly fee">`:`<button class="ofee ${cf&&fee!==cf?'cn':''}" onclick="OF.edit='${s.id}';render()">Rs ${fmt(fee)} ✏️</button>`}</td>
        ${cells.join('')}<td>${L.bal>0?`<span class="odue">Rs ${fmt(L.bal)}</span>`:`<span class="oclr">Clear</span>`}</td></tr>`;});
    return {rows,tot,due};
  });
  const startOpts=months.filter(m=>m<=now);
  $('#main').innerHTML=`${pageHead('Old months fee',esc(gLabel(g))+', '+y,'fee','fees')}
  ${ofViewTabs()}
  <div class="ofbar">
    <select onchange="OF.g=this.value;OF.edit='';render()" aria-label="Class">${gs.map(x=>`<option value="${esc(x)}" ${x===g?'selected':''}>${esc(gLabel(x))}</option>`).join('')}</select>
    <select onchange="OF.year=Number(this.value);render()" aria-label="Year">${years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select>
  </div>
  <div class="ofstart"><span>Count fee from</span><select id="ofFrom" aria-label="Count fee from">${startOpts.map(m=>`<option value="${m}">${mShort(m)}</option>`).join('')}</select><button class="btn sm" onclick="ofFromAll($('#ofFrom').value)">Apply to class</button></div>
  <p class="note" style="margin:-2px 2px 8px">Tap a month to fill the fee paid in it. If earlier months were missed, it fills the total still owed. Tap a filled month to change the amount.</p>
  <div class="ofwrap"><table class="oft">
    <thead><tr><th class="on oh">Student</th><th class="oh">Monthly fee</th>${MN.map((m,i)=>`<th class="oq${Math.floor(i/3)} ${months[i]===now?'onow':''}">${m}</th>`).join('')}<th class="oh">Due</th></tr></thead>
    <tbody>${body.rows.join('')||`<tr><td colspan="15" style="padding:20px">No students in this class.</td></tr>`}</tbody>
    <tfoot><tr class="orec"><td class="on">Received</td><td></td>${body.tot.map((t,i)=>`<td>${t?fmt(t):''}</td>`).join('')}<td>${fmt(sum(body.tot,x=>x))}</td></tr>
      <tr class="odr"><td class="on">Total due</td><td colspan="13"></td><td>Rs ${fmt(body.due)}</td></tr></tfoot>
  </table></div>
  <div class="oleg"><span><i class="ofc p"></i>Paid</span><span><i class="ofc h"></i>Part paid</span><span><i class="ofc d"></i>Due</span><span><i class="ofc pre"></i>Not counted yet</span><span><i class="ofc f"></i>Free</span><span><i class="ofee cn" style="width:22px;height:14px;padding:0"></i>Concession</span></div>
  <p class="note" style="margin-top:6px">${isOwner()?'':'Months already saved are locked. Ask the owner to change them. '}Changing a fee here applies to all months.</p>
  <div class="fabpad"></div>
  <button class="fab" onclick="ofSave()" style="${pendN?'':'opacity:.55'}"><span class="fi">✓</span><span class="ft"><b>Save${pendN?' ('+pendN+')':''}</b><small>${pendN?'Changes not saved yet':'Nothing changed yet'}</small></span></button>`;
  const fi=$('#ofFee');if(fi){fi.focus();fi.select();const done=()=>{const v=Math.max(0,Math.round(Number(fi.value)||0)), s=getS(OF.edit);if(s&&v!==feeAt(s,now))OF.fees[s.id]=v;OF.edit='';render();};fi.onblur=done;fi.onkeydown=e=>{if(e.key==='Enter')fi.blur();};}
  if(OF.sx){const w=$('.ofwrap');if(w)w.scrollLeft=OF.sx;}
  {const w=$('.ofwrap');if(w)w.onscroll=()=>{OF.sx=w.scrollLeft;};}
}
function ofSetAmount(id,m,amt){
  const saved=paysOf(id).filter(p=>monthOf(p.date)===m);
  if(saved.some(p=>!p.old)){toast('This month has a normal fee receipt. Change it from the receipt.');return false;}
  if(saved.length&&!isOwner()){toast('This month is saved. Ask the owner to change it.');return false;}
  OF.pend=OF.pend.filter(p=>!(p.studentId===id&&monthOf(p.date)===m));saved.forEach(p=>OF.rem.add(p.id));
  const s=getS(id);if(amt>0){const st=ofSim(()=>startOf(getS(id)));if(m<st)OF.from[id]=m;
    const fm=ofSim(()=>{const L=ledger(getS(id),thisMonth());const ms=[...new Set(L.items.filter(i=>i.m&&i.m<=m&&i.paid<i.amt).map(i=>i.m))];if(!ms.includes(m))ms.push(m);return ms.sort();});
    OF.pend.push({id:'pend-'+uid(),studentId:id,amount:Math.round(amt),date:midDay(m),forMonths:fm,old:true,created:Date.now()+OF.pend.length});}
  return true;
}
function ofOwe(id,m){const had=OF.from[id];const st=ofSim(()=>startOf(getS(id)));if(m<st)OF.from[id]=m;const o=ofSim(()=>owedUpTo(getS(id),m));if(had===undefined)delete OF.from[id];else OF.from[id]=had;return o;}
function ofFullFor(id,m){const st=ofSim(()=>startOf(getS(id)));if(m<st)OF.from[id]=m;const o=ofSim(()=>owedUpTo(getS(id),m));return o;}
function ofFull(id){const m=OF.month;const o=ofFullFor(id,m);if(o.amt<=0){toast('Nothing owed up to '+mShort(m));render();return;}
  if(ofSetAmount(id,m,o.amt)&&o.months.filter(Boolean).length>1)toast(`Rs ${Math.round(o.amt).toLocaleString('en-PK')} for ${monthsText(o.months)}`);render();}
function ofFillAll(){let n=0;const m=OF.month;
  classStudents(OF.g).forEach(s=>{const has=ofSim(()=>paysOf(s.id).some(p=>monthOf(p.date)===m));if(has)return;const c=ofSim(()=>ofCell(getS(s.id),m));if(c.k==='p'||c.k==='f'||c.k==='na'||c.k==='fut')return;
    const o=ofFullFor(s.id,m);if(o.amt>0&&ofSetAmount(s.id,m,o.amt))n++;});
  toast(n?`Filled ${pl(n,'student')} for ${mShort(m)}`:'Everyone is already paid for '+mShort(m));render();}
function ofMonthInput(el,id){const v=Math.max(0,Math.round(Number(el.value)||0));if(ofSetAmount(id,OF.month,v)){OF.focus=el.dataset.i!==undefined?Number(el.dataset.i)+1:null;render();}else render();}
function ofViewTabs(){return `<div class="ofview"><button class="${OF.view==='month'?'on':''}" onclick="OF.view='month';render()">📝 Enter by month</button><button class="${OF.view==='year'?'on':''}" onclick="OF.view='year';render()">📅 Whole year table</button></div>`;}
function viewOldFeeMonth(){
  const gs=isOwner()?allGroups(UI.camp).filter(x=>classStudents(x).length):myClasses();
  const g=OF.g, now=thisMonth(), cf=classFee(gCls(g)), fmt=n=>Math.round(n).toLocaleString('en-PK');
  const months=[];for(let m=nextM(prevM(now));months.length<36;m=prevM(m)){months.push(m);}
  if(!OF.month||OF.month>now)OF.month=now;
  const m=OF.month;
  OF.open=OF.open||{};
  const pendN=OF.pend.length+OF.rem.size+Object.keys(OF.fees).length+Object.keys(OF.from).length+Object.keys(OF.open).length;
  const data=ofSim(()=>classStudents(g).map(s=>{const c=ofCell(s,m), cash=sum(paysOf(s.id).filter(p=>monthOf(p.date)===m),'amount'), L=ledger(s,now);
    return {s,c,cash,fee:feeAt(s,now),bal:L.bal,ob:Number(s.opening)||0,start:L.start};}));
  data.forEach(d=>{const o=ofOwe(d.s.id,m);d.owe=o.amt;d.oweMonths=o.months.filter(Boolean);});
  const total=sum(data,'cash');
  const stTxt=d=>d.c.k==='p'?'<span class="omst p">Paid</span>':d.c.k==='h'?'<span class="omst h">Part</span>':d.c.k==='f'?'<span class="omst f">Free</span>':d.c.k==='pre'?'<span class="omst x">Not counted</span>':d.c.k==='na'?'<span class="omst x">Left</span>':'<span class="omst d">Due</span>';
  $('#main').innerHTML=`${pageHead('Old months fee',esc(gLabel(g)),'fee','fees')}
  ${ofViewTabs()}
  <div class="ofbar"><select onchange="OF.g=this.value;render()" aria-label="Class">${gs.map(x=>`<option value="${esc(x)}" ${x===g?'selected':''}>${esc(gLabel(x))}</option>`).join('')}</select></div>
  <div class="ommonth"><button onclick="OF.month=prevM(OF.month);render()" aria-label="Previous month">‹</button>
    <select onchange="OF.month=this.value;render()" aria-label="Month">${months.map(x=>`<option value="${x}" ${x===m?'selected':''}>${mShort(x)}</option>`).join('')}</select>
    <button onclick="if(OF.month<thisMonth()){OF.month=nextM(OF.month);render()}" aria-label="Next month" ${m>=now?'disabled':''}>›</button></div>
  <div class="omtop"><span><b>1.</b> Put each student's <b>old balance</b> once (what they owed before fee counting starts). <b>2.</b> Then pick a month and type the fee paid, or tap <b>Full</b>.</span>
    <button class="btn sm" onclick="ofFillAll()">All paid full fee</button></div>
  <div class="omwrap"><table class="omt">
    <thead><tr><th>Student</th><th>Fee</th><th>Old balance</th><th>Paid in ${mShort(m)}</th><th>Due (Rs)</th></tr></thead>
    <tbody>${data.map((d,i)=>{const s=d.s, ed=OF.edit===s.id, can=d.c.k!=='na'&&d.c.k!=='f';
      return `<tr class="or${i%5}"><td class="omname"><b>${esc(s.name)}</b><small>${stTxt(d)}</small></td>
      <td>${ed?`<input class="omfee" type="number" inputmode="numeric" id="ofFee" value="${d.fee}" aria-label="Monthly fee">`:`<button class="ofee ${cf&&d.fee!==cf?'cn':''}" onclick="OF.edit='${s.id}';render()">${fmt(d.fee)}✏️</button>`}</td>
      <td class="omob"><input class="omobin" type="number" inputmode="numeric" min="0" value="${d.ob||''}" placeholder="0" onchange="OF.open['${s.id}']=Math.max(0,Math.round(Number(this.value)||0));render()" onkeydown="if(event.key==='Enter')this.blur()" aria-label="Old balance of ${esc(s.name)}"></td>
      <td class="omamt">${can?`<input class="omin" type="number" inputmode="numeric" min="0" data-i="${i}" value="${d.cash||''}" placeholder="${d.owe>0?fmt(d.owe):'0'}" onchange="ofMonthInput(this,'${s.id}')" onkeydown="if(event.key==='Enter')this.blur()" aria-label="Amount paid by ${esc(s.name)}">`:'–'}
      ${can&&!d.cash&&d.owe>0?`<button class="omfull" onclick="ofFull('${s.id}')">Full${d.oweMonths.length>1?` <small>${d.oweMonths.length} months</small>`:''}</button>`:d.cash?`<button class="omclr" onclick="if(ofSetAmount('${s.id}',OF.month,0))render()" aria-label="Clear">✕</button>`:''}</td>
      <td>${d.bal>0?`<span class="odue">${fmt(d.bal)}</span>`:`<span class="oclr">Clear</span>`}</td></tr>`;}).join('')||'<tr><td colspan="5" style="padding:20px">No students in this class.</td></tr>'}</tbody>
    <tfoot><tr><td colspan="2">Totals</td><td>${fmt(sum(data,'ob'))}</td><td>${fmt(total)}</td><td>${fmt(sum(data,d=>Math.max(0,d.bal)))}</td></tr></tfoot>
  </table></div>
  <p class="note" style="margin-top:8px">${isOwner()?'':'Saved months are locked. Ask the owner to change them. '}Old balance is paid first, then the oldest month. The grey number in a box is what is owed up to that month.</p>
  <div class="fabpad"></div>
  <button class="fab" onclick="ofSave()" style="${pendN?'':'opacity:.55'}"><span class="fi">✓</span><span class="ft"><b>Save${pendN?' ('+pendN+')':''}</b><small>${pendN?'Changes not saved yet':'Nothing changed yet'}</small></span></button>`;
  const fi=$('#ofFee');if(fi){fi.focus();fi.select();const done=()=>{const v=Math.max(0,Math.round(Number(fi.value)||0)), s=getS(OF.edit);if(s&&v!==feeAt(s,now))OF.fees[s.id]=v;OF.edit='';render();};fi.onblur=done;fi.onkeydown=e=>{if(e.key==='Enter')fi.blur();};}
  if(OF.focus!=null){const n=document.querySelector(`.omin[data-i="${OF.focus}"]`);OF.focus=null;if(n){n.focus();}}
}
function ofFromAll(m){
  let n=0;classStudents(OF.g).forEach(s=>{const cur=ofSim(()=>startOf(getS(s.id)));if(m<cur){OF.from[s.id]=m;n++;}});
  toast(n?`Fee now counted from ${mShort(m)} for ${pl(n,'student')} (students admitted later start from admission)`:'Already counted from that month');render();
}
/* fee still owed up to and including month m */
function owedUpTo(s,m){const L=ledger(s,thisMonth());const its=L.items.filter(i=>i.m&&i.m<=m);return {amt:sum(its,i=>Math.max(0,i.amt-i.paid)),months:[...new Set(its.filter(i=>i.paid<i.amt).map(i=>i.m))]};}
function ofTap(id,m){
  const s=getS(id);
  const c=ofSim(()=>ofCell(getS(id),m));
  const pend=OF.pend.filter(p=>p.studentId===id&&monthOf(p.date)===m);
  const saved=ofSim(()=>paysOf(id).filter(p=>monthOf(p.date)===m&&!String(p.id).startsWith('pend-')));
  // month already has money in it: change the amount
  if(pend.length||saved.length){
    if(saved.length&&!isOwner()){toast('This month is saved. Ask the owner to change it.');return;}
    if(saved.some(p=>!p.old)){toast('This month has a normal fee receipt. Change it from the receipt.');return;}
    const curAmt=sum(pend,'amount')+sum(saved,'amount');
    const v=prompt(`${s.name}, fee paid in ${mShort(m)} (Rs). Write 0 to remove.`,curAmt);if(v===null)return;
    const amt=Math.max(0,Math.round(Number(v)||0));
    OF.pend=OF.pend.filter(p=>!(p.studentId===id&&monthOf(p.date)===m));saved.forEach(p=>OF.rem.add(p.id));
    if(amt>0)ofSetAmount(id,m,amt);
    render();return;
  }
  if(c.k==='pre'){
    // start counting fee for this student from this month
    OF.from[id]=m;
  }else if(c.k==='p'){toast('Already covered by an earlier payment. Tap a month with an amount to change it.');return;}
  const o=ofSim(()=>owedUpTo(getS(id),m));
  if(o.amt<=0){toast('Nothing owed up to '+mShort(m));render();return;}
  OF.pend.push({id:'pend-'+uid(),studentId:id,amount:Math.round(o.amt),date:midDay(m),forMonths:o.months.filter(Boolean).sort(),old:true,created:Date.now()+OF.pend.length});
  if(o.months.filter(Boolean).length>1)toast(`Rs ${Math.round(o.amt).toLocaleString('en-PK')} for ${monthsText(o.months)}`);
  render();
}
function ofSave(){
  OF.open=OF.open||{};
  const n=OF.pend.length+OF.rem.size+Object.keys(OF.fees).length+Object.keys(OF.from).length+Object.keys(OF.open).length;
  if(!n){toast('Nothing to save');return;}
  const ids=new Set([...Object.keys(OF.fees),...Object.keys(OF.from),...Object.keys(OF.open)]);
  const ups=[...ids].map(id=>{const o={};if(OF.fees[id]!==undefined)Object.assign(o,{fee:OF.fees[id],disc:0,fees:[{from:'0000-00',fee:OF.fees[id],disc:0}]});if(OF.from[id])o.feeFrom=OF.from[id];if(OF.open[id]!==undefined)o.opening=OF.open[id];return [id,o];});
  if(ups.length)updMany('students',ups);
  [...OF.rem].forEach(id=>del('payments',id));
  C={};
  let rn=nextReceipt();const pays=[];
  OF.pend.sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{const s=getS(p.studentId);if(!s||p.amount<=0)return;
    const L=ledger(s), m=monthOf(p.date);
    let left=p.amount;const cov=[];const order=p.forMonths?[...L.items.filter(i=>p.forMonths.includes(i.m)),...L.items.filter(i=>!p.forMonths.includes(i.m))]:L.items;
    for(const i of order){const u=i.amt-i.paid;if(u<=0)continue;if(left<=0)break;if(!cov.includes(i.m))cov.push(i.m);left-=Math.min(u,left);}
    const o={studentId:s.id,name:s.name,father:s.father||'',cls:s.cls,sec:s.sec||'',grp:gOf(s),roll:s.roll||'',amount:p.amount,date:p.date,
      method:'Old record',note:'Paid in '+mShort(m),forMonths:p.forMonths||undefined,receiptNo:rn++,prevBal:L.bal,disc:0,newBal:L.bal-p.amount,covers:monthsText(cov)||mShort(m),
      by:isOwner()?(S.settings.accountant||ME.name):ME.name,byUid:ME.uid,settled:true,old:true,created:Date.now()+pays.length};
    if(!o.forMonths)delete o.forMonths;pays.push(o);S.payments.push({...o,id:'tmp-'+pays.length});C={};
  });
  S.payments=S.payments.filter(p=>!String(p.id).startsWith('tmp-'));C={};
  if(pays.length)addMany('payments',pays);
  toast(`Saved: ${pl(pays.length,'payment')}${ups.length?', '+pl(ups.length,'student')+' updated':''}${OF.rem.size?', '+OF.rem.size+' changed':''}`);
  OF.pend=[];OF.rem=new Set();OF.fees={};OF.from={};OF.open={};render();
}

/* ================= Print the admission register: whole, by year or by class ================= */
let PR={by:'all',year:'',cls:'',stu:'all'};
function openPrintReg(){
  const all=S.students.filter(inCamp);
  const ys=[...new Set(all.map(s=>(s.admit||'').slice(0,4)).filter(Boolean))].sort().reverse();
  if(!PR.year)PR.year=ys[0]||'';
  if(!PR.cls)PR.cls=classes()[0]||'';
  const n=prList().length;
  sheet(`<h3>🖨️ Print register</h3><p class="muted">Choose what to print. It prints in the school register format, landscape.</p>
  <label>Print</label><div class="seg">${[['all','Whole register'],['year','Year wise'],['class','Class wise']].map(([k,l])=>`<button class="${PR.by===k?'on':''}" onclick="PR.by='${k}';openPrintReg()">${l}</button>`).join('')}</div>
  ${PR.by==='year'?`<label>Year of admission<select onchange="PR.year=this.value;openPrintReg()">${ys.map(y=>`<option ${y===PR.year?'selected':''}>${y}</option>`).join('')}</select></label>`:''}

function prList(){

/* ================= Rename a class everywhere (used once: Prep -> KG) ================= */
function renameClassEverywhere(oldC,newC){
  const same=c=>String(c||'').trim().toLowerCase()===oldC.toLowerCase();
  const swapG=g=>same(gCls(g))?gKey(newC,gSec(g),gCamp(g)):g;
  // settings
  const set=S.settings, cl=(set.classes||[]).slice();
  const i=cl.findIndex(same);if(i>=0){if(cl.some(c=>c===newC))cl.splice(i,1);else cl[i]=newC;}
  const fees={...(set.classFees||{})};Object.keys(fees).forEach(k=>{if(same(k)){if(!fees[newC])fees[newC]=fees[k];delete fees[k];}});
  const secs={};Object.entries(set.sections||{}).forEach(([k,v])=>{const nk=k.split('::').map(x=>same(x)?newC:x).join('::');secs[nk]=v;});
  saveSettingsData({classes:cl,classFees:fees,sections:secs,prepToKg:true});
  // students
  const su=[];S.students.forEach(s=>{const o={};['cls','admClass','wdClass','preClass'].forEach(f=>{if(same(s[f]))o[f]=newC;});if(Object.keys(o).length)su.push([s.id,o]);});
  if(su.length)updMany('students',su);
  // teachers' classes
  S.staff.forEach(t=>{const cs=(t.classes||[]).map(swapG);if(JSON.stringify(cs)!==JSON.stringify(t.classes||[]))upd('staff',t.id,{classes:cs});});
  // attendance: re-key the days of that class
  const old=S.attendance.filter(a=>same(gCls(a.cls)));
  old.forEach(a=>{const g=swapG(a.cls);put('attendance',attId(a.date,g),{...a,cls:g});if(attId(a.date,g)!==a.id)del('attendance',a.id);});
  // payments: class label
  const pu=[];S.payments.forEach(p=>{const o={};if(same(p.cls))o.cls=newC;if(p.grp&&same(gCls(p.grp)))o.grp=swapG(p.grp);if(Object.keys(o).length)pu.push([p.id,o]);});
  if(pu.length)updMany('payments',pu);
  toast(`${oldC} is now ${newC} everywhere`);
}

function preParse(line){
  let t=line.replace(/^\s*\d+[\).\-\s]+/,'').trim();if(!t)return null;
  const ph=(t.match(/0?3\d{2}[\s\-]?\d{7}/)||[''])[0];if(ph)t=t.replace(ph,'');
  let name=t,father='';
  const m=t.match(/^(.*?)\s+(?:s\/o|d\/o|son of|daughter of|bin|bint)\s+(.*)$/i);
  if(m){name=m[1];father=m[2];}else{const p=t.split(/[,\t;|]+/).map(x=>x.trim()).filter(Boolean);name=p[0]||'';father=p[1]||'';}
  name=name.replace(/[,\-]+$/,'').trim().toUpperCase();father=father.replace(/[,\-]+$/,'').trim().toUpperCase();
  return name?{name,father,phone:ph.replace(/\D/g,'').replace(/^(\d{4})/,'$1-')}:null;
}

    gender:guessSex({name:x.name})==='F'?'F':'M'}));

}

  <label class="btn" style="display:flex;margin-top:12px;cursor:pointer">📄 Choose Excel file<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="readPreExcel(this.files[0])"></label>
  <div id="px_out"></div>`);

async function readPreExcel(file){
  if(!file)return;
  try{const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    let hi=rows.findIndex(r=>r.some(c=>/name/i.test(String(c))));if(hi<0)hi=0;
    const hd=rows[hi].map(x=>String(x).toLowerCase());
    const col=re=>hd.findIndex(x=>re.test(x));
    const ci={name:col(/(student|child|^name|name of)/),father:col(/father|parent|guardian/),phone:col(/phone|mobile|contact|cell/),cls:col(/class|grade/),addr:col(/address|residence|village/),date:col(/date|admi|join/)};
    if(ci.name<0)ci.name=hd.findIndex(x=>/name/.test(x));
    if(ci.father===ci.name)ci.father=-1;
    const pcs=classes().filter(isPreCls), def=$('#px_cls').value;
    const fixCls=v=>{const x=String(v||'').trim();if(!x)return def;const l=clsLevel(x);return pcs.find(c=>clsLevel(c)===l)||def;};
    const out=rows.slice(hi+1).map(r=>{const name=String(r[ci.name]||'').trim();if(!name||/total/i.test(name))return null;
      const dv=ci.date>=0?r[ci.date]:'';const dd=dv instanceof Date?todayStr(dv):(parseDMY(String(dv))||'');
      return {name:name.toUpperCase(),father:ci.father>=0?String(r[ci.father]||'').trim().toUpperCase():'',phone:ci.phone>=0?String(r[ci.phone]||'').trim():'',cls:ci.cls>=0?fixCls(r[ci.cls]):def,addr:ci.addr>=0?String(r[ci.addr]||'').trim():'',date:dd};}).filter(Boolean);

/* ================= Check that data reaches the database ================= */
async function checkConnection(){
  const line=(ok,t,d)=>`<div class="mrow"><div><b class="${ok===true?'c-paid':ok===false?'c-due':''}">${ok===true?'✓':ok===false?'✕':'…'} ${t}</b>${d?`<small>${d}</small>`:''}</div></div>`;
  const show=rows=>sheet(`<h3>Check saving</h3><p class="muted">App version ${APP_VERSION}</p><div style="margin-top:10px">${rows.join('')}</div>
    <div class="actions"><button class="btn ghost" onclick="checkConnection()">Check again</button><button class="btn" onclick="closeSheet()">Close</button></div>`);
  const rows=[];
  if(!ONLINE){rows.push(line(false,'Test mode','This copy of the app has no Supabase settings, so records stay on this phone only. Open your GitHub link, not a downloaded file.'));show(rows);return;}
  rows.push(line(true,'Online version',esc(SUPABASE_URL.replace('https://',''))));
  rows.push(line(navigator.onLine,navigator.onLine?'Internet on':'No internet','Changes wait on the phone until internet returns.'));
  rows.push(line(Q.length?null:true,Q.length?pl(Q.length,'change')+' waiting to be sent':'Nothing waiting','' ));
  show(rows.concat(line(null,'Checking database...')));
  try{
    const {data:u}=await sb.auth.getUser();rows.push(line(!!(u&&u.user),'Signed in',esc(ME.email||'')+(isOwner()?', owner':', teacher')));
    const {count,error}=await sb.from('records').select('id',{count:'exact',head:true});
    if(error)throw error;rows.push(line(true,'Database can be read',`${count} records online. This phone has ${pl(S.students.length,'student')}.`));
    if(isOwner()){
      const id='check-'+ME.uid;
      const w=await sb.from('records').upsert({id,col:'check',cls:null,data:{at:Date.now()},updated_at:new Date().toISOString()});
      if(w.error)throw w.error;await sb.from('records').delete().eq('id',id);
      rows.push(line(true,'Database can be written','Saving works.'));
      const local=S.students.filter(s=>!s.id).length;
      const {count:sc}=await sb.from('records').select('id',{count:'exact',head:true}).eq('col','students');
      rows.push(line(sc===S.students.length?true:null,`${sc} students online`,sc===S.students.length?'Same as this phone.':`This phone shows ${S.students.length}. ${Q.length?'Wait for the changes above to be sent.':'Tap Refresh data in Settings.'}`));
    }
    if(Q.length)flush();
  }catch(e){
    const m=(e&&(e.message||e.code))||String(e);
    let tip='';
    if(/relation .*records.* does not exist|schema cache|Could not find the table/i.test(m))tip='The tables are missing. Run supabase-setup.sql again in Supabase SQL Editor.';
    else if(/row-level security|42501|permission/i.test(m))tip=isOwner()?'Your account is not the owner in the database. Run supabase-setup.sql again, then sign out and in.':'Your login has no classes yet. Ask the owner.';
    else if(/JWT|token|Invalid API key|apikey/i.test(m))tip='The key in index.html is wrong. Use the publishable key from Supabase.';
    else if(isNetErr(e))tip='No connection to Supabase. Check internet, or the project may be paused: open Supabase and tap Restore.';
    rows.push(line(false,'Problem: '+esc(m),tip));
  }
  show(rows);
}

function discChanged(){

function savePayment(){
  const s=getS(CF.id), amt=Math.max(0,Math.round(Number($('#c_amt').value||0))), disc=Math.max(0,Math.round(Number(($('#c_disc')||{}).value||0))), dm=disc?$('#c_dm').value:'';
  if(amt<=0&&disc<=0){$('#c_err').textContent='Enter the amount received or a discount.';return;}
  let pdate;try{pdate=getDate('c_date')||todayStr();}catch(e){$('#c_err').textContent=e.message;return;}
  const L=ledger(s), prev=L.bal;
  // which months this payment clears (after the discount)
  const items=L.items.map(i=>({...i}));let d=disc;
  if(d)for(const i of items){if(i.m!==dm)continue;const k=Math.min(d,i.amt-i.paid);i.amt-=k;d-=k;}
  let left=amt;const cov=[];
  for(const i of items){const u=i.amt-i.paid;if(u<=0)continue;if(left<=0)break;if(!cov.includes(i.m))cov.push(i.m);left-=Math.min(u,left);}
  let covers=monthsText(cov);if(left>0)covers=covers?covers+' + advance':'Advance';if(!amt&&disc)covers=mShort(dm)+' (discount)';
  const p={studentId:s.id,name:s.name,father:s.father||'',cls:s.cls,sec:s.sec||'',grp:gOf(s),roll:s.roll||'',amount:amt,date:pdate,

    by:isOwner()?(S.settings.accountant||ME.name):ME.name,byUid:ME.uid,settled:isOwner()||amt===0,created:Date.now()};
  add('payments',p);toast('Fee saved, receipt #'+recNo(p.receiptNo));showReceipt(p,false);
}

function receiptText(p){

function saveStudent(id){
  const own=isOwner(), old=id?getS(id):null;
  const fee=Math.round(Number($('#f_fee').value||0)), disc=Math.round(Number($('#f_disc').value||0));
  const o={name:$('#f_name').value.trim(),father:$('#f_father').value.trim(),cls:gCls($('#f_cls').value),sec:gSec($('#f_cls').value),campus:$('#f_camp')?$('#f_camp').value:gCamp($('#f_cls').value),roll:$('#f_roll').value.trim(),
    phone:$('#f_phone').value.trim(),admit:'',admNo:$('#f_admNo').value.trim(),dob:'',caste:$('#f_caste').value.trim(),
    occupation:$('#f_occ').value.trim(),residence:$('#f_res').value.trim(),admClass:$('#f_admCls').value,fileNo:$('#f_file').value.trim(),remarks:$('#f_rem').value.trim()};
  try{o.admit=getDate('f_admit')||todayStr();o.dob=getDate('f_dob');}catch(e){$('#f_err').textContent=e.message;return;}
  if(o.admNo&&S.students.some(x=>x.id!==id&&String(x.admNo)===o.admNo&&hnorm(x.name)===hnorm(o.name))){$('#f_err').textContent='Adm No. '+o.admNo+' is already given to another student.';return;}
  if(!o.name){$('#f_err').textContent='Enter the student name.';return;}
  if(fee<0||disc<0){$('#f_err').textContent='Fee and discount cannot be less than 0.';return;}
  if(own){o.fee=fee;o.disc=disc;o.opening=Math.round(Number($('#f_open').value||0));}
  if(id){
    if(own)o.fees=newFeeHist(old,fee,disc,$('#f_fix').checked);
    const act=$('#f_active').checked;o.active=act;
    if(!act){o.wdClass=$('#f_wdCls').value;try{o.wdDate=getDate('f_wdDate')||todayStr();}catch(e){$('#f_err').textContent=e.message;return;}if(isActive(old)||!old.leftMonth)o.leftMonth=monthOf(o.wdDate);}
    else{o.leftMonth=null;o.wdClass='';o.wdDate='';}
    upd('students',id,o);toast('Student saved');closeSheet();
  }else{
    if(!own){o.fee=fee;o.disc=0;o.opening=0;}
    if(!o.roll)o.roll=nextRoll(o.cls);
    o.fees=[{from:'0000-00',fee:o.fee,disc:o.disc}];o.active=true;o.created=Date.now();o.addedBy=ME.name;
    add('students',o);toast(o.name+' added');openStudentForm();
    $('#f_cls').value=gOf(o);$('#f_fee').value=o.fee;$('#f_roll').placeholder=String(Number(o.roll)+1||'');$('#f_admNo').value=nextAdmNo();
    $('#f_admit').value=dmy(o.admit);$('#f_res').value=o.residence;
    $('#f_err').textContent='Saved. Add the next student or tap Cancel.';$('#f_err').className='err ok';
  }
}

function setRange(k,m){
  const d=new Date(), t=todayStr();
  if(k==='today'){UI.from=UI.to=t;}
  else if(k==='yesterday'){d.setDate(d.getDate()-1);UI.from=UI.to=todayStr(d);}
  else if(k==='month'){const mm=m||thisMonth();UI.from=mm+'-01';const [y,mo]=mm.split('-').map(Number);UI.to=todayStr(new Date(y,mo,0));}
  else if(k==='last'){setRange('month',prevM(thisMonth()));}
}

  const title=(UI.from===UI.to?niceDate(UI.from):niceDate(UI.from)+' to '+niceDate(UI.to))+(UI.by?', by '+UI.by:'');
  const on=k=>{const save=[UI.from,UI.to];setRange(k);const r=UI.from===save[0]&&UI.to===save[1];[UI.from,UI.to]=save;return r?'on':'';};
  $('#main').innerHTML=`

async function saveTeacher(id){
  const name=$('#t_name').value.trim(), phone=$('#t_phone').value.trim();
  const old=id?S.staff.find(x=>x.id===id):null, cls=old?(old.classes||[]):[];
  if(!name){$('#t_err').textContent='Enter the teacher name.';return;}
  const newCls=TF?[...TF.cls]:cls;
  if(id){
    const user=suggestUser($('#t_user').value), pass=$('#t_pass').value.trim();
    const userChg=user&&user!==(old.username||''), passChg=!!pass;
    if(userChg&&user.length<3){$('#t_err').textContent='Username needs at least 3 letters or numbers.';return;}
    if(userChg&&S.staff.some(x=>x.id!==id&&x.username===user)){$('#t_err').textContent='This username is already used.';return;}
    if(passChg&&pass.length<6){$('#t_err').textContent='Password needs at least 6 characters.';return;}
    if(ONLINE&&(userChg||passChg)){
      if(!navigator.onLine){$('#t_err').textContent='Internet is needed to change the login.';return;}
      $('#t_save').disabled=true;$('#t_save').textContent='Changing login...';
      const {error}=await sb.rpc('set_teacher_login',{tid:id,new_username:userChg?user:null,new_password:passChg?pass:null});
      $('#t_save').disabled=false;$('#t_save').textContent='Save changes';
      if(error){$('#t_err').textContent=/function|schema cache|does not exist/i.test(error.message)?'Run the file supabase-update-teacher-login.sql in Supabase once, then try again.':error.message;return;}
    }
    // a class has one teacher: take ticked classes away from others
    S.staff.filter(x=>x.id!==id&&(x.classes||[]).some(g=>newCls.includes(g))).forEach(x=>upd('staff',x.id,{classes:(x.classes||[]).filter(g=>!newCls.includes(g))}));
    upd('staff',id,{name,phone,classes:newCls,active:$('#t_active').checked,...(userChg?{username:user}:{})});
    if(userChg||passChg){const o={...old,name,phone,username:userChg?user:old.username};toast('Login changed');showCreds(o,passChg?pass:'(not changed)',true);return;}
    toast('Teacher saved');closeSheet();render();return;
  }
  const user=suggestUser($('#t_user').value), pass=$('#t_pass').value.trim();
  if(user.length<3){$('#t_err').textContent='Username needs at least 3 letters or numbers.';return;}
  if(S.staff.some(x=>x.username===user)){$('#t_err').textContent='This username is already used.';return;}
  if(ONLINE&&pass.length<6){$('#t_err').textContent='Password needs at least 6 characters.';return;}
  const o={name,phone,classes:newCls,username:user,active:true,role:'teacher',created:Date.now()};
  S.staff.filter(x=>(x.classes||[]).some(g=>newCls.includes(g))).forEach(x=>upd('staff',x.id,{classes:(x.classes||[]).filter(g=>!newCls.includes(g))}));
  if(!ONLINE){add('staff',o);toast(name+' added');showCreds(o,'');return;}
  if(!navigator.onLine){$('#t_err').textContent='Internet is needed to create a teacher login.';return;}
  $('#t_save').disabled=true;$('#t_save').textContent='Creating login...';
  const done=msg=>{$('#t_save').disabled=false;$('#t_save').textContent='Save teacher';$('#t_err').textContent=msg;};
  try{
    const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'gvps-staff-maker'}});
    const {data,error}=await tmp.auth.signUp({email:user+'@'+STAFF_DOMAIN,password:pass});
    if(error){done(/registered|exists/i.test(error.message)?'This username is already used. Try another.':/signup|disabled/i.test(error.message)?'Turn on "Allow new users to sign up" in Supabase first.':'Could not create login: '+error.message);return;}
    if(!data.session||!data.user){done('Turn off "Confirm email" in Supabase (Authentication > Sign In / Providers > Email), then try again. If you tried before, use a new username.');return;}
    try{await tmp.auth.signOut();}catch(e){}
    o.id=data.user.id;
    const {error:pe}=await sb.from('profiles').upsert(toProfile(o));
    if(pe){done('Login made, but saving the teacher failed: '+pe.message);return;}
    apply('staff',o);C={};render();
    toast(name+' added');showCreds(o,pass);
  }catch(e){done('Could not create login: '+(e.message||e));}
}

const hnorm = v => String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
function guessMap(headers){
  const map={}, used=new Set(), H=headers.map(hnorm);
  IMP_FIELDS.forEach(([f,,keys])=>{const i=H.findIndex((h,j)=>!used.has(j)&&keys.includes(h));if(i>=0){map[f]=i;used.add(i);}});
  // looser match; father/phone before name so "Father Name" is not taken as the student name
  ['father','phone','fee','disc','sec','wdClass','wdDate','dob','occupation','caste','residence','fileNo','remarks','admNo','opening','admit','roll','cls','name'].forEach(f=>{
    if(map[f]!==undefined)return;const keys=IMP_FIELDS.find(x=>x[0]===f)[2];
    const i=H.findIndex((h,j)=>!used.has(j)&&h&&keys.some(k=>k.length>3&&h.includes(k)));
    if(i>=0){map[f]=i;used.add(i);}
  });
  return map;
}
function findHeaderRow(rows){
  let best=0,score=-1;
  rows.slice(0,15).forEach((r,i)=>{const m=Object.keys(guessMap(r||[])).length;if(m>score){score=m;best=i;}});
  return best;
}
function cellStr(v){if(v==null)return '';if(v instanceof Date)return todayStr(v);return String(v).trim();}
function cellDob(v){const s=String(v??'');const m=s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})\s*$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return cellDate(v);}
function cellNum(v){if(typeof v==='number')return Math.round(v);const n=String(v??'').replace(/[^0-9.]/g,'');return n?Math.round(Number(n)):0;}
function cellPhone(v){let s=typeof v==='number'?String(Math.round(v)):String(v??'').trim();if(/^3\d{9}$/.test(s))s='0'+s;if(/^923\d{9}$/.test(s))s='0'+s.slice(2);return s;}
function cellDate(v){const out=cellDate0(v);return /^(19|20)\d\d-\d\d-\d\d$/.test(out)&&parseDMY(dmy(out))?out:'';}
function cellDate0(v){
  if(typeof v==='number'&&v>1&&v<100000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return d.toISOString().slice(0,10);}
  if(v instanceof Date&&!isNaN(v))return todayStr(v);
  const s=String(v??'').trim();if(!s)return '';
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  const d=new Date(s);return isNaN(d)?'':todayStr(d);
}
function normCls(v,extra){
  v=String(v??'').trim();if(!v)return '';
  const all=classes().concat(extra||[]);
  const same=x=>all.find(c=>hnorm(c)===hnorm(x));
  if(same(v))return same(v);
  const m=v.match(/^(?:class|grade|std|cls)?\s*[-.:]?\s*(\d{1,2})\s*(?:st|nd|rd|th)?(?:\s*[-(]?\s*[a-z]\)?)?$/i);
  if(m){const c='Class '+Number(m[1]);return same(c)||c;}
  const alias={pg:'Playgroup',playgroup:'Playgroup',play:'Playgroup',nursery:'Nursery',nur:'Nursery',prep:'KG',kg:'KG',kindergarten:'KG',ece:'Playgroup'};
  if(alias[hnorm(v)])return same(alias[hnorm(v)])||alias[hnorm(v)];
  return v.replace(/\s+/g,' ').replace(/\b\w/g,ch=>ch.toUpperCase());
}

async function readImport(file){
  if(!file)return;$('#i_err').textContent='Reading file...';$('#i_err').className='err ok';
  try{
    const X=await loadXLSX();
    const wb=X.read(await file.arrayBuffer(),{type:'array'});
    IMP={wb,file:file.name,sheetName:wb.SheetNames[0],defCls:gCls(UI.cls)||classes()[0],camp:UI.camp||''};
    // pick the sheet with most rows if the first one is empty
    const sizes=wb.SheetNames.map(n=>X.utils.sheet_to_json(wb.Sheets[n],{header:1,blankrows:false}).length);
    IMP.sheetName=wb.SheetNames[sizes.indexOf(Math.max(...sizes))];

  }catch(e){$('#i_err').className='err';$('#i_err').textContent='Could not read this file: '+(e.message||e);}
}
function loadImportSheet(){
  const rows=XLSX.utils.sheet_to_json(IMP.wb.Sheets[IMP.sheetName],{header:1,blankrows:false,defval:''});
  IMP.rows=rows;IMP.hi=findHeaderRow(rows);
  IMP.headers=(rows[IMP.hi]||[]).map((h,i)=>cellStr(h)||'Column '+(i+1));
  IMP.map=guessMap(rows[IMP.hi]||[]);
  IMP.status=guessStatus();
  IMP.swap={};IMP.swapN={};
  /* Excel often reads dd-mm-yyyy as mm-dd-yyyy when the day is 12 or less, and keeps the rest as text.
     If every real Excel date in a column has day <= 12 and the text dates start with 13 or more, the days and months were swapped. */
  ['admit','wdDate'].forEach(f=>{const ci=IMP.map[f];if(ci===undefined||ci<0)return;let ser=0,bigDay=0,txtHigh=0;
    for(let i=IMP.hi+1;i<rows.length;i++){const v=(rows[i]||[])[ci];
      if(typeof v==='number'&&v>1000){ser++;const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);if(d.getUTCDate()>12)bigDay++;}
      else{const m=String(v||'').match(/^(\d{1,2})[-/.]\d{1,2}[-/.]\d{4}/);if(m&&+m[1]>12)txtHigh++;}}
    if(ser&&!bigDay&&txtHigh){IMP.swap[f]=true;IMP.swapN[f]=ser;}});
}
function impDate(f,v){
  if(typeof v==='number'&&v>1000&&IMP.swap&&IMP.swap[f]){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);
    const y=d.getUTCFullYear(),mo=d.getUTCMonth()+1,dd=d.getUTCDate();return parseDMY(String(mo).padStart(2,'0')+'-'+String(dd).padStart(2,'0')+'-'+y);}
  return cellDate(v);
}
function buildImport(){
  const {rows,hi,map}=IMP, out=[], skipped=[], newCls=[], seen=new Set(), seenAdm=new Set();
  if(!IMP.replace)S.students.forEach(s=>{seen.add(hnorm(s.name)+'|'+hnorm(s.father)+'|'+hnorm(s.cls));if(s.admNo)seenAdm.add(String(s.admNo).trim()+'|'+hnorm(s.name));});
  const g=(r,f)=>map[f]!==undefined&&map[f]>=0?r[map[f]]:'';
  const rollNext={};let anNext=IMP.replace?1+rows.slice(hi+1).reduce((m,r)=>Math.max(m,parseInt(cellStr(g(r,'admNo')))||0),0):nextAdmNo();
  const old=IMP.status==='left';
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[], name=cellStr(g(r,'name')).replace(/\s+/g,' ');
    if(!name||/^(total|grand total)$/i.test(name))continue;
    const cls=normCls(cellStr(g(r,'cls')),newCls)||IMP.defCls;
    const father=cellStr(g(r,'father')).replace(/\s+/g,' ');
    let admNo=cellStr(g(r,'admNo'));
    const key=hnorm(name)+'|'+hnorm(father)+'|'+hnorm(cls);
    if((admNo&&seenAdm.has(admNo+'|'+hnorm(name)))||(!admNo&&seen.has(key))){skipped.push(name);continue;}
    if(!classes().includes(cls)&&!newCls.includes(cls))newCls.push(cls);
    seen.add(key);if(admNo)seenAdm.add(admNo+'|'+hnorm(name));else admNo=String(anNext++);
    const feeCell=g(r,'fee'), fee=String(feeCell).trim()!==''?cellNum(feeCell):classFee(cls);
    let roll=cellStr(g(r,'roll'));
    if(!roll&&!old){if(rollNext[cls]===undefined)rollNext[cls]=Number(nextRoll(cls));roll=String(rollNext[cls]++);}
    const wdDate=impDate('wdDate',g(r,'wdDate')), wdClass=normCls(cellStr(g(r,'wdClass')),newCls);
    const arrears=cellNum(g(r,'opening')), left=old||!!wdDate;
    const sec=cellStr(g(r,'sec')).toUpperCase();
    const o={name,father,cls,sec,campus:IMP.camp||'',roll,admNo,phone:cellPhone(g(r,'phone')),fee,disc:cellNum(g(r,'disc')),
      admit:impDate('admit',g(r,'admit'))||(IMP.status==='left'?'':todayStr()),dob:cellDob(g(r,'dob')),caste:cellStr(g(r,'caste')),occupation:cellStr(g(r,'occupation')),
      residence:cellStr(g(r,'residence')),admClass:cls,arrears:arrears||'',fileNo:cellStr(g(r,'fileNo')),remarks:cellStr(g(r,'remarks')),
      opening:left?0:arrears,active:!left,created:Date.now(),addedBy:ME.name};
    if(left){o.wdDate=wdDate;o.wdClass=wdClass||(wdDate?cls:'');o.leftMonth=wdDate?monthOf(wdDate):prevM(S.settings.startMonth||thisMonth());}
    if(wdClass&&wdClass!==cls&&!classes().includes(wdClass)&&!newCls.includes(wdClass))newCls.push(wdClass);
    o.fees=[{from:'0000-00',fee:o.fee,disc:o.disc}];
    out.push(o);
  }
  return {out,skipped,newCls};
}
function guessStatus(){
  const {rows,hi,map}=IMP;if(map.admit===undefined)return 'active';
  const ys=[];for(let i=hi+1;i<rows.length;i++){const d=cellDate((rows[i]||[])[map.admit]);if(d)ys.push(+d.slice(0,4));}
  if(!ys.length)return 'active';ys.sort((a,b)=>a-b);
  return ys[Math.floor(ys.length/2)]<new Date().getFullYear()-12?'left':'active';
}
function showImport(){

    <label>Class for students with no class in the file<select onchange="IMP.defCls=this.value;showImport()">${classes().map(c=>`<option ${c===IMP.defCls?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
  </div></details>
  ${hasCampus()?`<label>Campus<select onchange="IMP.camp=this.value;showImport()">${campusKeys().map(k=>`<option value="${esc(k)}" ${k===(IMP.camp||'')?'selected':''}>${esc(campName(k))}</option>`).join('')}</select></label>`:''}
  ${Object.keys(IMP.swap||{}).map(f=>`<label class="check" style="margin-top:12px"><input type="checkbox" ${IMP.swap[f]?'checked':''} onchange="IMP.swap['${f}']=this.checked;showImport()"> Fix ${f==='admit'?'admission':'withdrawal'} dates: Excel read ${IMP.swapN[f]} dd-mm-yyyy dates the wrong way round (01-02 as 2 January)</label>`).join('')}
  ${isOwner()?`<label class="check" style="margin-top:14px"><input type="checkbox" ${IMP.replace?'checked':''} onchange="IMP.replace=this.checked;showImport()"> Start fresh: remove all old students, fees and attendance in the app</label>`:''}
  <label>These students are</label><div class="seg">${[['active','Studying now'],['left','History']].map(([k,t])=>`<button class="${IMP.status===k?'on':''}" onclick="IMP.status='${k}';showImport()">${t}</button>`).join('')}</div>
  <p class="note">${IMP.status==='left'?'All go into the register as history. Next, in Current Students, you choose who is studying now in each class.':'Monthly fee is charged and they appear in their class attendance. Rows with a withdrawal date are saved as left.'}</p>
  ${out.length?`<div class="balbox good" style="margin-top:12px"><span>Ready to import</span><b>${out.length} students</b>
    <div class="brk">${Object.keys(byCls).sort((a,b)=>classes().indexOf(a)-classes().indexOf(b)).map(c=>`<div><span>${esc(c)}</span><span>${byCls[c]}</span></div>`).join('')}</div></div>`
  :`<div class="total" style="margin-top:12px"><span>No students found. Check that "Student name" points to the right column.</span><span></span></div>`}
  ${newCls.length?`<p class="note" style="margin-top:8px">New classes will be added: ${esc(newCls.join(', '))}. Set their fee later in Settings.</p>`:''}
  ${IMP.replace?`<div class="total" style="margin-top:10px"><span>${pl(S.students.length,'old student')} and their fees and attendance will be removed.</span><span></span></div>`:''}
  ${skipped.length?`<p class="note">${pl(skipped.length,'row')} skipped because the student is repeated or already in the app.</p>`:''}
  ${out.length?`<h3 class="sec">First rows</h3><div class="card tblwrap" style="padding:0 6px"><table class="tbl">
    <tr><th>Adm</th><th>Name</th><th>Father</th><th>Class</th><th>Admitted</th><th>Born</th>${IMP.status==='left'?'':'<th class="n">Fee</th>'}</tr>
    ${out.slice(0,6).map(o=>`<tr><td>${esc(o.admNo)}</td><td>${esc(o.name)}</td><td>${esc(o.father)}</td><td>${esc(o.cls)}</td><td>${dmy(o.admit)}</td><td>${dmy(o.dob)}</td>${IMP.status==='left'?'':`<td class="n">${o.fee?rs(o.fee):'<span class="c-due">0</span>'}</td>`}</tr>`).join('')}
  </table></div>`:''}
  ${IMP.status!=='left'&&out.some(o=>o.active&&!o.fee)?'<p class="note c-part">Some students have no fee. Set the class fee in Settings before importing, or add a fee column.</p>':''}
  <div class="actions"><button class="btn ghost" onclick="openImport()">Other file</button><button class="btn green" ${out.length?'':'disabled'} onclick="doImport()">Import ${pl(out.length,'student')}</button></div>`);
}
function clsLevel(c){const x=hnorm(c);if(/^(pg|playgroup|play|ece)$/.test(x))return 0;if(/^(nursery|nur)$/.test(x))return 1;if(/^(kg|prep|kindergarten)$/.test(x))return 2;
  const m=String(c).match(/^Class (\d+)$/);return m?2+Number(m[1]):99;}
function classesWith(list,used){
  let cl=classes().slice();const fees={...(S.settings.classFees||{})};
  list.forEach(n=>{if(cl.some(c=>sameCls(c,n)))return;const lv=clsLevel(n);
    if(lv<99){const same=cl.findIndex(c=>clsLevel(c)===lv);if(same>=0&&!used(cl[same])){if(fees[cl[same]]&&!fees[n])fees[n]=fees[cl[same]];delete fees[cl[same]];cl[same]=n;return;}}
    let i=lv===99?-1:cl.findIndex(c=>clsLevel(c)>lv);if(i<0)i=cl.length;cl.splice(i,0,n);});
  return {classes:cl,classFees:fees};
}
const WIPE=[['students','All students (register and current)'],['payments','All fee receipts'],['attendance','All attendance'],['certs','All issued certificates'],['charges','All extra charges'],['photo','All saved photos']];
function openWipe(){
  sheet(`<h3 style="color:var(--due)">⚠️ Delete data</h3><p class="muted">Tick what to delete. School settings, classes, fees and teachers stay.</p>
  <div class="cks" style="grid-template-columns:1fr;margin-top:10px">${WIPE.map(([k,l])=>`<label><input type="checkbox" class="wp" value="${k}"> ${l} <small class="muted">&nbsp;${k==='photo'?'':'('+((S[k]||[]).length)+')'}</small></label>`).join('')}</div>
  <div class="actions"><button class="btn sm ghost" onclick="document.querySelectorAll('.wp').forEach(x=>x.checked=true)">Tick all</button></div>
  <div class="total" style="margin-top:12px"><span>This cannot be undone. Everyone using the app loses these records.</span><span></span></div>
  <label>Type DELETE to confirm<input id="wp_ok" autocomplete="off" autocapitalize="characters" placeholder="DELETE"></label>
  <p id="wp_err" class="err"></p>
  <div class="actions"><button class="btn ghost" onclick="backup()">Download backup first</button><button class="btn red" onclick="doWipe()">Delete now</button></div>`);
}
async function doWipe(){
  const cols=[...document.querySelectorAll('.wp:checked')].map(x=>x.value);
  if(!cols.length){$('#wp_err').textContent='Tick at least one thing to delete.';return;}
  if($('#wp_ok').value.trim().toUpperCase()!=='DELETE'){$('#wp_err').textContent='Type DELETE in the box to confirm.';return;}
  if(!confirm('Last check: delete '+cols.length+' kind(s) of records for everyone? This cannot be undone.'))return;
  try{
    if(ONLINE){
      if(!navigator.onLine)throw new Error('Internet is needed to delete.');
      Q=Q.filter(op=>!(op.table==='records'&&op.rows&&op.rows.some(r=>cols.includes(r.col))));saveQueue();
      const {error}=await sb.from('records').delete().in('col',cols);if(error)throw error;
    }
    cols.forEach(k=>{if(k==='photo')S.photos=[];else S[k]=[];});C={};saveLocal();
    closeSheet();toast('Deleted');go('home');
  }catch(e){$('#wp_err').textContent='Could not delete: '+(e.message||e);}
}
async function wipeAll(){
  if(ONLINE){
    if(!navigator.onLine)throw new Error('Internet is needed to remove the old records.');
    Q=Q.filter(op=>op.table!=='records');saveQueue();
    const {error}=await sb.from('records').delete().in('col',['students','payments','attendance','charges']);
    if(error)throw error;
  }
  S.students=[];S.payments=[];S.attendance=[];S.charges=[];C={};saveLocal();
}
async function doImport(){
  const {out,newCls}=buildImport();if(!out.length)return;
  if(IMP.replace){
    if(!confirm(`Remove ${pl(S.students.length,'old student')} with all their fees and attendance, and put ${pl(out.length,'student')} from this file instead? This cannot be undone.`))return;
    try{toast('Removing old records...');await wipeAll();}catch(e){toast('Could not remove old records: '+(e.message||e));return;}
  }
  const used=c=>S.students.some(s=>sameCls(s.cls,c))||out.some(o=>sameCls(o.cls,c));
  if(newCls.length)saveSettingsData(classesWith(newCls,used));
  addMany('students',out);UI.stu=IMP.status==='left'?'left':'active';const left=IMP.status==='left';IMP=null;closeSheet();UI.cls='';UI.curMode='students';go(left?'current':'current');
  toast(pl(out.length,'student')+' imported');
}
function regRows(list){
  return list.map(s=>REG_COLS.map(([k])=>{
    if(k==='dob')return s.dob?dobWords(s.dob):'';
    if(k==='admClass')return regCls(s.admClass||s.cls);
    if(k==='wdClass')return isActive(s)?'':regCls(s.wdClass||'');
    if(k==='arrears'){if(s.arrears)return Number(s.arrears)||s.arrears;if(!isActive(s)){const b=ledger(s).bal;return b>0?b:'';}return '';}
    if(k==='admNo'){const n=Number(s.admNo);return s.admNo&&String(n)===String(s.admNo).trim()?n:(s.admNo||'');}
    if(k==='wdDate')return isActive(s)?'':(s.wdDate||'');
    return s[k]||'';
  }));
}
function regSheet(X,list){
  const ws=X.utils.aoa_to_sheet([REG_COLS.map(c=>c[1])].concat(regRows(list)));
  const toSerial=d=>{const [y,m,dd]=d.split('-').map(Number);return (Date.UTC(y,m-1,dd)-Date.UTC(1899,11,30))/86400000;};
  [0,11].forEach(ci=>{for(let r=1;r<=list.length;r++){const a=X.utils.encode_cell({r,c:ci}),c=ws[a];
    if(c&&typeof c.v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(c.v))ws[a]={t:'n',v:toSerial(c.v),z:'dd-mm-yyyy'};}});
  ws['!cols']=[17,9,21,62,21,13,18,27,20,11,22,17,9,14].map(w=>({wch:w}));
  return ws;
}

function openRegisterExport(){

  sheet(`<h3>Admission register</h3><p class="muted">Download in the school register format (Excel), the same columns as your register.</p>
  <label>Which students<select id="r_y"><option value="all">All years (${S.students.length})</option>${ys.map(y=>`<option value="${y}">Admitted in ${y} (${S.students.filter(s=>(s.admit||'').startsWith(y)).length})</option>`).join('')}</select></label>
  <label class="check"><input type="checkbox" id="r_split"> One sheet per year</label>
  <div class="actions"><button class="btn ghost" onclick="openSettings()">Back</button><button class="btn" onclick="exportRegister()">Download Excel</button></div>`);

async function exportRegister(){
  try{
    const X=await loadXLSX(), y=$('#r_y').value, split=$('#r_split').checked;
    const sorted=l=>l.slice().sort((a,b)=>(a.admit||'').localeCompare(b.admit||'')||(parseInt(a.admNo)||0)-(parseInt(b.admNo)||0));
    let list=sorted(S.students.filter(s=>inReg(s)&&(y==='all'||(s.admit||'').startsWith(y))));
    if(!list.length){toast('No students for this choice');return;}
    const wb=X.utils.book_new();
    if(split){const ys=[...new Set(list.map(s=>(s.admit||'').slice(0,4)||'No date'))].sort();ys.forEach(yy=>X.utils.book_append_sheet(wb,regSheet(X,list.filter(s=>((s.admit||'').slice(0,4)||'No date')===yy)),yy));}
    else X.utils.book_append_sheet(wb,regSheet(X,list),y==='all'?'Admission Register':y);
    X.writeFile(wb,`GVPS admission register ${y==='all'?todayStr():y}.xlsx`);
  }catch(e){toast(e.message||'Could not make the file');}
}

/* ================= Install as app ================= */
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function isInstalled(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function refreshInstall(){const b=$('#instBtn');if(b)b.hidden=isInstalled();if(ME&&!$('#app').hidden)render();}
function installBanner(){
  if(isInstalled()||UI.hideInst)return '';
  return `<div class="inst no-print"><img src="icon-192.png" onerror="this.onerror=null;this.src=LOGO" alt=""><div><b>Download the GVPS app</b>Opens from your home screen like a normal app.</div>
  <button class="btn sm" onclick="installApp()">Download</button></div>`;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refreshInstall();});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;UI.hideInst=true;toast('App installed on this device');refreshInstall();});
async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r=await deferredPrompt.userChoice.catch(()=>({}));
    deferredPrompt=null;
    if(r&&r.outcome==='accepted'){UI.hideInst=true;toast('Installing app...');}
    refreshInstall();return;
  }
  const steps=isIOS
    ?`<li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with arrow).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>`
    :location.protocol==='file:'
    ?`<li>This file is opened from phone storage, so it cannot be installed.</li><li>Upload it to your website (GitHub Pages or Netlify), open that link in Chrome, then tap Download again.</li>`
    :`<li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>, then <b>Install</b>.</li>`;
  sheet(`<div style="text-align:center"><img class="logo lg" src="${LOGO}" alt=""><h3>Download the app</h3><p class="muted">GVPS School App</p></div>
  <ol class="steps">${steps}</ol>
  <p class="note" style="margin-top:12px">The app icon with the school logo will appear on your home screen.</p>
  <div class="actions"><button class="btn ghost" onclick="closeSheet()">OK</button></div>`);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{reg.update().catch(()=>{});setInterval(()=>reg.update().catch(()=>{}),30*60000);}).catch(()=>{});
    let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||Q.length)return;reloaded=true;location.reload();});
  });
  /* tell the user when GitHub has a newer version than the one on screen */
  async function checkNewVersion(){
    if(!navigator.onLine)return;
    try{const t=await (await fetch('index.html?check='+Date.now(),{cache:'no-store'})).text();const m=t.match(/APP_VERSION = '([^']+)'/);
      if(m&&m[1]!==APP_VERSION&&!$('#newVer')){const b=document.createElement('div');b.id='newVer';b.className='test';b.style.cssText='cursor:pointer;background:var(--b1);color:var(--b2)';
        b.textContent='A new version is ready ('+m[1].split(' ').pop()+'). Tap here to update.';b.onclick=()=>{if(Q.length&&!confirm('Some changes are still waiting to be sent. Update anyway?'))return;location.reload();};
        document.body.prepend(b);}}catch(e){}
  }
  window.checkNewVersion=checkNewVersion;
  window.addEventListener('load',()=>setTimeout(checkNewVersion,4000));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkNewVersion();});
}

/* ================= Sign in and start ================= */
function showLogin(){
  ME=null;if($('#l_ver'))$('#l_ver').textContent='App version '+APP_VERSION.split(' ').pop();$('#app').hidden=true;$('#login').hidden=false;closeSheet();
  $('#l_school').textContent=S.settings.school;
  $('#l_form').hidden=!ONLINE;$('#l_pick').hidden=ONLINE;
  if(!ONLINE){
    const t=S.staff.filter(x=>x.active!==false);
    $('#l_pick').innerHTML=`<p class="muted">Test mode: who is using the app?</p><div class="pick">
      <button class="btn" onclick="startAs('owner')">${esc(S.settings.ownerName||'Owner')} (owner)</button>
      ${t.map(x=>`<button class="btn ghost" onclick="startAs('${x.id}')">${esc(x.name)} <span class="muted" style="font-weight:500">&nbsp;${esc((x.classes||[]).join(', '))}</span></button>`).join('')}</div>
      ${t.length?'':'<p class="note" style="margin-top:10px">Open as owner, then add teachers in Settings.</p>'}`;
  }
}
function startAs(sid){
  if(sid==='owner')ME={uid:'owner',role:'owner',name:S.settings.ownerName||'Owner'};
  else{const t=S.staff.find(x=>x.id===sid&&x.active!==false);if(!t){try{localStorage.removeItem(SKEY);}catch(e){}showLogin();return;}ME={uid:t.id,role:'teacher',name:t.name,classes:t.classes||[]};}
  try{localStorage.setItem(SKEY,sid);}catch(e){}
  UI.tab='';UI.cls='';UI.attCls='';UI.date=todayStr();showApp();
}
function switchUser(){try{localStorage.removeItem(SKEY);}catch(e){}showLogin();}
function doLogin(){
  $('#l_err').textContent='';
  let v=$('#l_email').value.trim();if(!v){$('#l_err').textContent='Enter your email or username.';return;}
  if(!v.includes('@'))v=suggestUser(v)+'@'+STAFF_DOMAIN;
  sb.auth.signInWithPassword({email:v,password:$('#l_pass').value}).then(({error})=>{
    if(error)$('#l_err').textContent=isNetErr(error)?'No internet. Check connection and try again.':/confirm/i.test(error.message)?'This email is not confirmed. Turn off "Confirm email" in Supabase or confirm it there.':'Wrong username or password.';
  });
}
async function signOut(silent){
  if(!silent&&Q.length&&!confirm(`${Q.length} changes are not sent yet because there is no internet. If you sign out now they will be lost. Sign out anyway?`))return;
  closeSheet();stopListening();Q=[];try{localStorage.removeItem(queueKey());}catch(e){}
  ME=null;await sb.auth.signOut().catch(()=>{});showLogin();
}
function showApp(){$('#login').hidden=true;$('#app').hidden=false;render();}
async function resolveRole(user){
  const meKey='gvps-me-'+user.id;let pr=null, net=false;
  try{
    let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
    if(r.error)throw r.error;pr=r.data;
    if(!pr){const c=await sb.rpc('claim_owner');if(c.error)throw c.error;
      if(c.data==='owner'){r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();pr=r.data;}}
  }catch(e){net=isNetErr(e);if(!net)console.error(e);}
  if(!pr&&net){try{pr=JSON.parse(localStorage.getItem(meKey)||'null');}catch(e){}}
  if(!pr||pr.active===false){noAccess(!pr&&!net?'This account is not added to the school. Ask the owner.':'');return;}
  try{localStorage.setItem(meKey,JSON.stringify(pr));}catch(e){}
  ME=pr.role==='owner'?{uid:user.id,role:'owner',name:pr.name||'Owner',email:user.email}:{uid:user.id,role:'teacher',name:pr.name,classes:pr.classes||[],email:user.email};
  S={students:[],payments:[],charges:[],staff:[],attendance:[],photos:[],certs:[],settings:{...DEFAULTS}};
  loadLocal();loadQueue();Q.forEach(applyOpLocal);
  if(isOwner())ME.name=S.settings.ownerName||ME.name;
  UI.tab='';UI.cls='';UI.attCls='';UI.date=todayStr();
  showApp();subscribe();await fetchAll();flush();
}
function noAccess(msg){toast(msg||'This account has no access to the school app.');setTimeout(()=>signOut(true),1800);}
function boot(){
  if(!ONLINE){
    loadLocal();
    if(!S.settings.startMonth){S.settings.startMonth=thisMonth();saveLocal();}
    $('#testBar').hidden=false;
    let sid=null;try{sid=localStorage.getItem(SKEY);}catch(e){}
    if(sid)startAs(sid);else showLogin();
    return;
  }
  if(typeof supabase==='undefined'){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">Could not load the app. Check internet and reload the page.</p>';return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gvps-auth'}});
  let started=false;
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_OUT'){if(ME){stopListening();ME=null;showLogin();}return;}
    if(session&&session.user&&(!ME||ME.uid!==session.user.id)){started=true;setTimeout(()=>resolveRole(session.user),0);}
    else if(ev==='INITIAL_SESSION'&&!session){started=true;showLogin();}
  });
  setTimeout(()=>{if(!started&&!ME)showLogin();},4000);
}
boot();
refreshInstall();
