.kscam{position:relative;width:86px;height:86px;border-radius:50%;overflow:hidden;background:#0f172a;flex:none;box-shadow:0 0 0 3px #38bdf8}
.kscam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.kscam span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:9px;color:#fff;padding:6px}
.ksdots{display:flex;justify-content:center;gap:12px;margin:14px 0 4px}.ksdots i{width:16px;height:16px;border-radius:50%;border:2px solid #94a3b8}.ksdots i.on{background:#0369a1;border-color:#0369a1}
.ksmsg{text-align:center;font-size:13px;font-weight:700;color:var(--muted);min-height:18px;margin:2px 0 8px}.ksmsg.bad{color:#b91c1c}
.kskeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kskeys button{height:56px;border:1px solid var(--line);border-radius:16px;background:var(--soft,#f1f5f9);font:inherit;font-size:24px;font-weight:800;color:var(--ink);cursor:pointer}
.kskeys button:active{transform:scale(.96);background:#e0f2fe}.kskeys .kx{color:#b91c1c;font-size:20px}.kskeys .kb{font-size:20px}
.ksok{width:100%;margin-top:10px;height:54px;border:0;border-radius:16px;font:inherit;font-size:17px;font-weight:900;color:#fff;cursor:pointer;background:linear-gradient(145deg,#4ade80,#15803d)}
.ksok:disabled{opacity:.45}
.ksban{position:fixed;inset:0;z-index:160;display:grid;place-items:center;background:rgba(8,16,32,.55)}
.ksban>div{width:min(320px,86vw);text-align:center;padding:22px 16px;border-radius:24px;color:#fff;background:linear-gradient(145deg,#4ade80,#15803d);box-shadow:0 20px 40px -18px #000}
.ksban.out>div{background:linear-gradient(145deg,#fb923c,#c2410c)}.ksban.warn>div{background:linear-gradient(145deg,#fbbf24,#b45309)}.ksban.bad>div{background:linear-gradient(145deg,#f87171,#b91c1c)}
.ksban img{width:110px;height:130px;object-fit:cover;border-radius:16px;border:3px solid #fff}
.ksban span{display:grid;place-items:center;width:84px;height:84px;margin:0 auto;border-radius:50%;background:rgba(255,255,255,.25);font-size:44px;font-weight:900}
.ksban b{display:block;font-size:22px;margin-top:10px}.ksban small{display:block;font-size:14px;margin-top:4px;opacity:.95}
.kslog{display:flex;flex-direction:column;gap:6px;margin-top:8px}.kslog>div{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.kslog>div>div{flex:1}.kslog b{display:block;font-size:14px}.kslog small{font-size:12px;color:var(--muted)}
.kspinlist{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.kspinlist button{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.kspinlist em{font-style:normal;font-size:10.5px;font-weight:800;border-radius:20px;padding:1px 7px}.kspinlist em.ok{color:#15803d;background:#dcfce7}.kspinlist em.no{color:#c2410c;background:#ffedd5}
.tattbtn.ksbtn{background:linear-gradient(145deg,#fbbf24,#c2410c)!important;box-shadow:0 12px 20px -12px #c2410c!important}
.taimg{display:block;max-width:100%;max-height:60vh;margin:10px auto 0;border-radius:16px}

body.kiosk header .icon-btn{display:none!important}

.taic{display:flex;gap:4px;justify-content:flex-end}.taic:empty{display:none}

.fadv{font-size:11px;font-weight:800;color:#1d4ed8;background:#dbeafe;border-radius:20px;padding:2px 8px}
@media (prefers-color-scheme:dark){.fadv{background:#16284a;color:#9cc0ff}}

/* ===== age summary ===== */
.agcalc{margin-bottom:12px;padding:12px;border-radius:18px;background:linear-gradient(135deg,#fdf2f8,#f5f3ff);border:1.5px solid #f9a8d4}
.agcalc>b{font-size:15px;color:#be185d}
.agcalc input{width:100%;box-sizing:border-box}.agcalc .two{gap:8px}.agcalc label{min-width:0}
.agq{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.agq button{border:1.5px solid #f9a8d4;background:#fff;color:#be185d;border-radius:20px;padding:5px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.agq button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#be185d,#f472b6)}
.agres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.agres div{text-align:center;border-radius:14px;padding:8px;color:#fff;background:linear-gradient(145deg,#f472b6,#be185d)}
.agres b{display:block;font-size:24px}.agres span{font-size:11px;font-weight:700}.agres p{grid-column:1/-1;margin:2px 0 0;text-align:center;font-size:13px;color:#831843}
.agstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.agstats div{position:relative;overflow:hidden;border-radius:14px;padding:8px 10px;color:#fff;background:linear-gradient(145deg,var(--a2),var(--a1));border:1.5px solid rgba(255,255,255,.7);box-shadow:inset 0 2px 5px rgba(255,255,255,.35)}
.agstats span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.92}.agstats b{font-size:20px}.agstats small{font-size:10.5px;margin-left:3px}
.agtabs{display:flex;gap:4px;border-bottom:2px solid #e5e7eb;margin:6px 0 10px}
.agtabs button{border:0;background:none;padding:9px 12px;font:inherit;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;border-top:3px solid transparent;border-radius:8px 8px 0 0}
.agtabs button.on{color:var(--ink);background:var(--card);border-top-color:#dc2626;box-shadow:0 -1px 0 #e5e7eb}
.agwrap{padding:0!important;border-radius:14px!important;overflow:auto}
.agt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.agt th{background:linear-gradient(180deg,#eef2ff,#e0e7ff);color:#3730a3;padding:8px 6px;font-weight:800;position:sticky;top:0;white-space:nowrap}
.agt td{padding:7px 6px;text-align:center;border-bottom:1px solid #eef1f6;white-space:nowrap}
.agt td:first-child,.agt th:first-child{position:sticky;left:0;text-align:left;background:var(--card);z-index:1;padding-left:10px}
.agt tr.ar0 td:first-child{border-left:4px solid #60a5fa}.agt tr.ar1 td:first-child{border-left:4px solid #4ade80}.agt tr.ar2 td:first-child{border-left:4px solid #a78bfa}.agt tr.ar3 td:first-child{border-left:4px solid #fbbf24}.agt tr.ar4 td:first-child{border-left:4px solid #f472b6}.agt tr.ar5 td:first-child{border-left:4px solid #2dd4bf}
.agm,.agf{display:inline-block;min-width:24px;padding:2px 5px;border-radius:6px;font-weight:800;font-size:12px}
.agm{background:#e0f2fe;color:#075985;border:1px solid #bae6fd}.agf{background:#fce7f3;color:#9d174d;border:1px solid #fbcfe8}
.agt i{font-style:normal;color:#94a3b8;margin:0 3px}
.agt .tt{background:#f8fafc}.agsum{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.agt tr.agtot td{background:#f1f5f9;font-size:13.5px}
@media (prefers-color-scheme:dark){.agcalc{background:linear-gradient(135deg,#2a1820,#241b3d);border-color:#7a2a50}.agq button{background:#1a1020}.agt th{background:#1c2946;color:#b9cdf5}.agt .tt,.agt tr.agtot td{background:#16213a}.agm{background:#0c2233;color:#7dd3fc;border-color:#164e63}.agf{background:#2a1820;color:#f9a8d4;border-color:#7a2a50}}
/* ===== certificate designs ===== */
.cfmts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}.cfmts>b{font-size:13px;color:var(--muted);margin-right:2px}
.cfmts button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:5px 10px 5px 5px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
.cfmts button.on{border-color:var(--c1,#15803d);box-shadow:0 0 0 2px var(--c1,#15803d) inset}
.cfm{width:22px;height:28px;border-radius:4px;background:#fffdf7;border:2px solid #15803d;display:inline-block}
.cfm.f-royal{border:3px double #b8892c;background:#0f1f4b}.cfm.f-islamic{border:3px solid #0d5c22;background:repeating-conic-gradient(#e8c766 0 25%,#fffdf7 0 50%) 0 0/6px 6px}
.cfm.f-modern{border:0;background:linear-gradient(90deg,#2563eb 0 30%,#fff 30%)}.cfm.f-elegant{border:1.5px solid #7c3aed;outline:1.5px solid #c4b5fd;outline-offset:-5px;background:#fbf8ff}.cfm.f-minimal{border:1px solid #94a3b8;background:#fff}
/* royal */
.cert.f-royal{background:radial-gradient(circle at 50% 40%,#fffdf5,#f7efdb)}
.cert.f-royal .b1{inset:14px;border:10px solid #0f1f4b;border-radius:0}.cert.f-royal .b2{inset:30px;border:3px double #b8892c;border-radius:0}
.cert.f-royal .b3{inset:38px;border:1px solid #b8892c}.cert.f-royal .ribbon{background:linear-gradient(90deg,#0f1f4b,#b8892c,#0f1f4b)!important}
.cert.f-royal .cn{border-color:#b8892c!important;background:#0f1f4b!important}.cert.f-royal .t1{color:#b8892c!important;font-family:"Great Vibes",cursive}.cert.f-royal .t2{background:#0f1f4b!important;color:#f2d78a!important}
.cert.f-royal .sn{color:#0f1f4b!important}.cert.f-royal .f{color:#0f1f4b;border-color:#b8892c}
/* islamic */
.cert.f-islamic{background:#fffdf3}
.cert.f-islamic .b1{inset:16px;border:16px solid transparent;border-image:repeating-linear-gradient(45deg,#0d5c22 0 7px,#e8c766 7px 10px,#0d5c22 10px 17px,#fffdf3 17px 20px) 16;border-radius:0}
.cert.f-islamic .b2{inset:38px;border:2px solid #0d5c22;border-radius:0}.cert.f-islamic .b3{inset:44px;border:1px solid #b8892c}
.cert.f-islamic .ribbon{display:none}.cert.f-islamic .cn{border-radius:50%!important;background:#e8c766!important;border-color:#0d5c22!important}
.cert.f-islamic .tt{background:radial-gradient(ellipse at 50% 100%,rgba(13,92,34,.08),transparent 70%);border-radius:200px 200px 0 0;padding-top:16px}
.cert.f-islamic .t1{color:#0d5c22!important}.cert.f-islamic .t2{background:#0d5c22!important;color:#fff!important}
.cert.f-islamic .in::before{content:"بسم الله الرحمن الرحيم";display:block;text-align:center;font-family:"Noto Nastaliq Urdu",serif;font-size:20px;color:#0d5c22;margin-bottom:6px}
/* modern */
.cert.f-modern{background:#fff}
.cert.f-modern .b1{inset:0 auto 0 0;width:70px;border:0;border-radius:0;background:linear-gradient(180deg,var(--k1),var(--k2))}
.cert.f-modern .b2{inset:24px 24px 24px 94px;border:1px solid #e2e8f0}.cert.f-modern .b3,.cert.f-modern .cn,.cert.f-modern .ribbon{display:none}
.cert.f-modern .in{inset:56px 56px 56px 112px!important}.cert.f-modern .t1{font-family:"Plus Jakarta Sans",sans-serif!important;font-weight:900;letter-spacing:6px;font-size:22px!important;color:#64748b!important;text-transform:uppercase}
.cert.f-modern .t2{background:none!important;color:var(--k1)!important;font-size:34px!important;letter-spacing:1px}
.cert.f-modern .f{border-bottom:2px solid var(--k1)}
/* elegant */
.cert.f-elegant{background:linear-gradient(135deg,#fbf8ff,#fff 40%,#fdf7ff)}
.cert.f-elegant .b1{inset:22px;border:1.5px solid var(--k1);border-radius:24px}.cert.f-elegant .b2{inset:32px;border:1px dashed var(--k2);border-radius:18px}.cert.f-elegant .b3{display:none}
.cert.f-elegant .ribbon{display:none}.cert.f-elegant .cn{width:60px!important;height:60px!important;border-radius:50%!important;background:radial-gradient(circle,var(--k2),var(--k1))!important;border:0!important;opacity:.25}
.cert.f-elegant .t1{font-family:"Great Vibes",cursive!important;font-size:64px!important;color:var(--k1)!important}.cert.f-elegant .t2{background:none!important;color:var(--k2)!important;letter-spacing:6px;border-top:1px solid var(--k2);border-bottom:1px solid var(--k2)}
/* minimal */
.cert.f-minimal{background:#fff}
.cert.f-minimal .b1{inset:30px;border:1px solid #94a3b8;border-radius:0}.cert.f-minimal .b2,.cert.f-minimal .b3,.cert.f-minimal .cn,.cert.f-minimal .ribbon{display:none}
.cert.f-minimal .wm{opacity:.03!important}.cert.f-minimal .t1{color:#334155!important;font-family:Georgia,serif!important}.cert.f-minimal .t2{background:none!important;color:#0f172a!important;letter-spacing:4px;font-family:Georgia,serif}
.cert.f-minimal .bd{font-family:Georgia,serif}
/* ===== ID cards ===== */
.idlbl{display:block;font-size:13px;margin:10px 0 4px}
.iddz{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.iddz button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 2px;font:inherit;font-size:10.5px;font-weight:800;cursor:pointer;color:var(--ink);text-align:center}
.iddz button.on{border-color:#1d4ed8;box-shadow:0 0 0 2px #1d4ed8 inset}
.idmini{width:44px;height:28px;border-radius:4px;overflow:hidden;position:relative;border:1px solid #cbd5e1;background:#fff}
.idmini i{position:absolute;left:0;right:0;top:0;height:9px}
.idmini.d-classic i{background:#0d5c22}.idmini.d-royal{background:#0f1f4b}.idmini.d-royal i{background:#b8892c}.idmini.d-rainbow i{height:28px;background:linear-gradient(135deg,#f472b6,#fbbf24,#4ade80,#60a5fa);opacity:.7}
.idmini.d-modern i{width:12px;height:28px;background:linear-gradient(180deg,#2563eb,#7c3aed)}.idmini.d-minimal i{height:3px;background:#0f172a}
.idpick{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:220px;overflow:auto}
.idpick label{display:flex;align-items:center;gap:6px;margin:0;padding:6px 8px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink)}
.idpick label.on{background:#eff6ff;border-color:#93c5fd}.idpick input{width:16px;height:16px;margin:0}
.idprev{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px;border-radius:14px;background:repeating-linear-gradient(45deg,#f1f5f9 0 10px,#e2e8f0 10px 20px)}
.idprev .idc{zoom:1.15}
.idsheet{display:none}
.idc{width:85.6mm;height:54mm;box-sizing:border-box;position:relative;overflow:hidden;border-radius:3mm;background:#fff;color:#0f172a;font-family:"Plus Jakarta Sans",Arial,sans-serif;font-size:2.6mm;box-shadow:0 2px 8px rgba(0,0,0,.18);color-scheme:light;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.idc.empty{box-shadow:none;background:none}
.idhd{display:flex;align-items:center;gap:2mm;height:11mm;padding:0 3mm;color:#fff;background:linear-gradient(135deg,#0d5c22,#1aa37a)}
.idhd img{width:8mm;height:8mm;border-radius:50%;background:#fff}.idhd b{display:block;font-size:3.3mm;line-height:1.1}.idhd span{font-size:2.2mm;opacity:.9}
.idbody{display:flex;gap:3mm;padding:2.5mm 3mm}
.idph{width:19mm;height:23mm;flex:none;border-radius:2mm;overflow:hidden;border:0.6mm solid #0d5c22;background:#e7f2ea;display:grid;place-items:center}
.idph img{width:100%;height:100%;object-fit:cover}.idph span{font-size:7mm;font-weight:900;color:#0d5c22}
.idtx{flex:1;min-width:0;line-height:1.35}.idtx .idnm{display:block;font-size:3.6mm;color:#0d5c22;margin-bottom:.8mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idtx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.idtx i{display:inline-block;width:12mm;font-style:normal;color:#64748b;font-size:2.3mm}
.idft{position:absolute;left:0;right:0;bottom:0;height:5.5mm;display:flex;justify-content:space-between;align-items:center;padding:0 3mm;font-size:2.3mm;font-weight:800;letter-spacing:.4mm;color:#fff;background:#0d5c22}
.idbk{padding:3mm 3.5mm;line-height:1.35}.idbk>b{font-size:2.8mm;color:#0d5c22}.idbk p{margin:.5mm 0 1.5mm;font-size:2.6mm}
.idrow{display:flex;gap:3mm}.idrow div{font-weight:700}.idrow i{display:block;font-style:normal;font-size:2.1mm;color:#64748b;font-weight:600}
.idbk ul{margin:1.5mm 0 0;padding-left:3.5mm;font-size:2.2mm;color:#475569}
.idsig{position:absolute;right:4mm;bottom:7mm;text-align:center;font-size:2.2mm;color:#475569}.idsig img{height:7mm;display:block;margin:0 auto}.idsig .ln{display:block;width:20mm;border-top:.3mm solid #475569;margin-bottom:.5mm}
.idstrip{position:absolute;left:0;right:0;bottom:0;height:4mm;background:linear-gradient(90deg,#0d5c22,#1aa37a)}
/* designs */
.idc.d-royal{background:linear-gradient(160deg,#fffdf5,#f7efdb)}.idc.d-royal .idhd,.idc.d-royal .idft,.idc.d-royal .idstrip{background:linear-gradient(135deg,#0f1f4b,#1e3a8a)}.idc.d-royal .idft{color:#f2d78a}
.idc.d-royal .idph{border-color:#b8892c}.idc.d-royal .idtx .idnm,.idc.d-royal .idbk>b{color:#0f1f4b}.idc.d-royal .idhd{border-bottom:.8mm solid #b8892c}
.idc.d-rainbow{background:linear-gradient(160deg,#fff7fb,#fffbea 50%,#effaf3)}.idc.d-rainbow .idhd{background:linear-gradient(90deg,#ec4899,#f59e0b,#22c55e,#3b82f6)}
.idc.d-rainbow .idft,.idc.d-rainbow .idstrip{background:linear-gradient(90deg,#3b82f6,#22c55e,#f59e0b,#ec4899)}.idc.d-rainbow .idph{border-color:#ec4899;border-radius:50%;width:21mm;height:21mm}
.idc.d-rainbow .idtx .idnm{color:#db2777}.idc.d-rainbow .idbk>b{color:#2563eb}
.idc.d-modern .idhd{margin-left:9mm;background:none;color:#1e293b}.idc.d-modern .idhd img{border:.4mm solid #2563eb}
.idc.d-modern::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6mm;background:linear-gradient(180deg,#2563eb,#7c3aed)}
.idc.d-modern .idbody{margin-left:6mm}.idc.d-modern .idft{left:6mm;background:#f1f5f9;color:#2563eb}.idc.d-modern .idph{border-color:#7c3aed}.idc.d-modern .idtx .idnm,.idc.d-modern .idbk>b{color:#4338ca}
.idc.d-modern .idbk{margin-left:6mm}.idc.d-modern .idstrip{left:6mm;background:#e2e8f0}
.idc.d-minimal{border:.3mm solid #cbd5e1}.idc.d-minimal .idhd{background:#fff;color:#0f172a;border-bottom:.6mm solid #0f172a}.idc.d-minimal .idft{background:#fff;color:#0f172a;border-top:.3mm solid #cbd5e1}
.idc.d-minimal .idph{border-color:#0f172a;background:#f8fafc}.idc.d-minimal .idph span,.idc.d-minimal .idtx .idnm,.idc.d-minimal .idbk>b{color:#0f172a}.idc.d-minimal .idstrip{height:1mm;background:#0f172a}
@media print{
  body.pr-idcards #main>*:not(.idsheet),body.pr-idcards .rep-head,body.pr-idcards .phead{display:none!important}
  body.pr-idcards .idsheet{display:block!important}
  body.pr-idcards header,body.pr-idcards nav,body.pr-idcards #toast,body.pr-idcards .hfoot{display:none!important}
  body.pr-idcards main,body.pr-idcards #app{padding:0!important;margin:0!important}
  body.pr-idcards .idpage{display:grid;grid-template-columns:repeat(2,85.6mm);grid-template-rows:repeat(5,54mm);gap:2mm 6mm;justify-content:center;align-content:start;height:278mm;overflow:hidden;page-break-after:always;break-after:page;page-break-inside:avoid}
  body.pr-idcards .idc{box-shadow:none;border:.2mm dashed #cbd5e1}
  body.pr-idcards .idc.empty{border:0}
}

.cfm.f-golden{border:3px solid #b8892c;background:linear-gradient(135deg,#fff8e1,#f6e3a8)}.cfm.f-floral{border:2px dotted #db2777;background:radial-gradient(circle at 20% 20%,#fbcfe8 0 3px,#fff 4px)}
.cfm.f-kids{border:3px dashed #f59e0b;background:linear-gradient(135deg,#bae6fd,#fef9c3,#fbcfe8)}
/* golden */
.cert.f-golden{background:radial-gradient(circle at 50% 35%,#fffaf0,#f8ecc8)}
.cert.f-golden .b1{inset:16px;border:6px solid transparent;border-image:linear-gradient(135deg,#8a6a1a,#f2d78a,#b8892c,#f7e7b4,#8a6a1a) 6;border-radius:0}
.cert.f-golden .b2{inset:30px;border:1.5px solid #b8892c;border-radius:0}.cert.f-golden .b3{inset:36px;border:.5px solid #d9b45a}

  background:linear-gradient(135deg,#1e3a8a,#3730a3 55%,#6d28d9);border:1.5px solid rgba(255,255,255,.6);box-shadow:0 12px 22px -16px #3730a3,inset 0 2px 6px rgba(255,255,255,.25)}
.frstrip::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:42%;border-radius:16px 16px 50% 50%;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
.frstrip div{position:relative;text-align:center;flex:1}.frstrip span{display:block;font-size:10.5px;font-weight:700;opacity:.85;letter-spacing:.3px}
.frstrip b{font-size:17px}.frstrip .g b{color:#86efac}.frstrip .r b{color:#fda4af}
.frstrip i{width:1px;height:28px;background:rgba(255,255,255,.25)}
.frdn b{font-size:13.5px!important;padding:6px 6px!important}
.frt-t td.frdn{vertical-align:middle}
.frlg,.frsetd{display:none!important}
.fetools{margin-bottom:8px!important}

.frbar select+select{flex:0 0 96px!important}

/* keep class, year and settings on one row, always on screen */
.frbar{display:flex!important;flex-wrap:nowrap!important;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.frbar select{width:auto!important;min-width:0!important;margin:0!important;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.frbar select:first-child{flex:1 1 0!important}
.frbar select+select{flex:0 0 84px!important;width:84px!important}
.frbar .frgear{flex:0 0 44px!important;width:44px!important;padding:0;display:grid;place-items:center}

/* ===== simple receive window ===== */
.rp2{padding-top:4px}
.rp2h{display:flex;align-items:center;gap:12px}
.rp2h>span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(145deg,#818cf8,#4338ca);box-shadow:0 6px 14px -8px #4338ca,inset 0 2px 5px rgba(255,255,255,.4)}
.rp2h b{display:block;font-size:18px}.rp2h small{font-size:12.5px;color:var(--muted)}
.rp2due{position:relative;overflow:hidden;margin-top:14px;padding:14px 16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,#e11d48,#be123c 50%,#9f1239);border:1.5px solid rgba(255,255,255,.6);box-shadow:0 14px 24px -16px #be123c,inset 0 2px 6px rgba(255,255,255,.3)}
.rp2due.ok{background:linear-gradient(135deg,#10b981,#047857)}
.rp2due::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:42%;border-radius:18px 18px 50% 50%;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.rp2due small{display:block;font-size:12px;font-weight:800;opacity:.9;letter-spacing:.4px}.rp2due b{display:block;font-size:30px;line-height:1.15}.rp2due em{display:block;font-style:normal;font-size:12px;opacity:.9;margin-top:2px}
.rp2l{display:block;margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--muted)}
.rp2in{display:flex;align-items:center;gap:8px;padding:0 14px;height:64px;border-radius:18px;border:2px solid #a5b4fc;background:linear-gradient(145deg,#f5f7ff,#fff);box-shadow:inset 0 2px 6px rgba(67,56,202,.08)}
.rp2in:focus-within{border-color:#4338ca;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.rp2in span{font-weight:900;font-size:20px;color:#4338ca}
.rp2in input{flex:1;min-width:0;border:0!important;background:none!important;height:60px!important;font:inherit;font-size:30px!important;font-weight:900;color:var(--ink);outline:none;box-shadow:none!important;padding:0!important;margin:0!important}
.rp2after{min-height:30px;margin-top:8px;text-align:center}
.rp2after span{display:inline-block;padding:5px 14px;border-radius:20px;font-size:14px;font-weight:900}
.rp2after .d{background:#fff1f2;color:#be123c;border:1.5px solid #fda4af}.rp2after .g{background:#ecfdf5;color:#047857;border:1.5px solid #6ee7b7}
.rp2act{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:8px}
.rp2act button{height:54px;border-radius:16px;font:inherit;font-weight:900;font-size:16px;cursor:pointer}
.rp2c{border:1.5px solid var(--line);background:var(--card);color:var(--muted)}
.rp2s{position:relative;overflow:hidden;border:1.5px solid rgba(255,255,255,.7);color:#fff;background:linear-gradient(145deg,#34d399,#059669);box-shadow:0 12px 20px -12px #059669,inset 0 2px 6px rgba(255,255,255,.4)}
.rp2s::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:44%;border-radius:14px 14px 50% 50%;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0))}
@media (prefers-color-scheme:dark){.rp2in{background:#111827;border-color:#3b2f63}.rp2after .d{background:#3a1a19}.rp2after .g{background:#10261a}}

.rp2in input{-moz-appearance:textfield;appearance:textfield}.rp2in input::-webkit-outer-spin-button,.rp2in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ===== colourful months, simple due ===== */
.mo0{--mc:#0d9488;--ml:#ccfbf1}.mo1{--mc:#0284c7;--ml:#e0f2fe}.mo2{--mc:#4f46e5;--ml:#e0e7ff}.mo3{--mc:#7c3aed;--ml:#ede9fe}

.frwrap{background:#fff!important;box-shadow:0 10px 30px -18px rgba(30,41,59,.45)!important;border:1px solid #e5e9f2!important;border-radius:18px!important}

.frt-t th.frdn{background:#fff1f2!important;color:#be123c!important;box-shadow:inset 0 -2px 0 #fecdd3!important}
.frt-t th.mh{color:var(--mc)!important;box-shadow:inset 0 -3px 0 var(--mc)!important;background:linear-gradient(180deg,#fff,var(--ml))!important}
.frt-t th.mh.cur{color:#fff!important;background:linear-gradient(145deg,var(--mc),color-mix(in srgb,var(--mc) 70%,#000))!important;border-radius:10px 10px 0 0}
.frt-t td{background:#fff;border-bottom:1px solid #f1f5f9!important;border-right:0!important}
.frt-t tr.fr1 td{background:#fcfdff!important}.frt-t tr.fr1 td.frn{background:#fafbfe!important}
.frn b{color:#0f172a}.frr{background:#e0e7ff!important;color:#3730a3!important}
/* due now: simple */
.frt-t td.frdn{background:#fff!important;border-right:1px solid #f1f5f9!important}
.frdn b{all:unset;display:inline-block;min-width:64px;text-align:center;font-weight:900;font-size:14px;padding:5px 8px;border-radius:10px}
.frdn b::after{display:none!important}
.frdn b.d{color:#be123c;background:#fff1f2;border:1px solid #fecdd3}

.frt-t tfoot td.frdn{background:#fff1f2!important;color:#be123c!important}

.frc span::after{opacity:.9}
.frc.ok span{background:linear-gradient(145deg,color-mix(in srgb,var(--mc) 75%,#fff),var(--mc))!important;color:#fff!important;border:1.5px solid rgba(255,255,255,.7)!important;box-shadow:0 6px 12px -8px var(--mc)!important}

.frc.no span{background:#fff!important;color:var(--mc)!important;border:2px solid var(--mc)!important;box-shadow:0 4px 10px -8px var(--mc)!important}
.frc.no i{opacity:1!important}

.frc.adv span{background:var(--ml)!important;color:var(--mc)!important;border:2px dashed var(--mc)!important}
.frc.na span,.frc.fu span{background:color-mix(in srgb,var(--ml) 45%,#fff)!important;border:1.5px dashed color-mix(in srgb,var(--mc) 35%,#fff)!important;color:color-mix(in srgb,var(--mc) 55%,#fff)!important}
.frt-t tfoot td{background:#1e293b!important}

  .frc.no span{background:#0f172a!important}.frdn b.d{background:#3a1a19}.frt-t th.mh{background:#111827!important}}

.frt-t td.frdn b.a{color:#0369a1!important;background:#f0f9ff!important;border:1px solid #bae6fd!important}
.frt-t td.frdn b::after{content:none!important}

.frt-t tfoot td.frdn{background:#fff1f2!important;color:#be123c!important}

function nextM(m){let [y,mm]=m.split('-').map(Number);mm++;if(mm>12){mm=1;y++;}return y+'-'+String(mm).padStart(2,'0');}
function prevM(m){let [y,mm]=m.split('-').map(Number);mm--;if(mm<1){mm=12;y--;}return y+'-'+String(mm).padStart(2,'0');}
function monthName(m){if(!m)return 'Old dues';const [y,mm]=m.split('-');return new Date(+y,+mm-1,1).toLocaleString('en',{month:'long',year:'numeric'});}

function parseDMY(v){const m=String(v||'').trim().match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);if(!m)return '';const d=+m[1],mo=+m[2],y=+m[3];

function inWords(n){
  n=Math.round(Math.abs(n));if(!n)return 'Zero Rupees Only';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const o=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1000);n%=1000;
  if(cr)o.push(three(cr)+' Crore');if(lk)o.push(two(lk)+' Lakh');if(th)o.push(two(th)+' Thousand');if(n)o.push(three(n));
  return o.join(' ')+' Rupees Only';
}

async function flush(){
  if(!ONLINE||flushing||!Q.length||!sb)return;
  flushing=true;
  try{
    while(Q.length){
      const op=Q[0];let res;
      try{
        // keep only the newest copy of each row in one send
        if(op.t==='up'){const m={};op.rows.forEach(r=>m[r.id]=r);res=await sb.from(op.table).upsert(Object.values(m));
          if(res.error&&op.table==='profiles'&&/salary/i.test(res.error.message||'')){res=await sb.from(op.table).upsert(Object.values(m).map(({salary,...x})=>x));if(!res.error)toast('Saved, but salary needs the update: run supabase-update-salary.sql in Supabase.');}}
        else res=await sb.from(op.table).delete().in('id',op.ids);
      }catch(e){res={error:e};}
      if(res.error){
        if(isNetErr(res.error))break;
        console.error(res.error);
        const rows=(op.rows||[]).map(x=>x.col).filter(Boolean), sqlHint=rows.includes('tatt')?' Run supabase-update-teacher-attendance.sql in Supabase.':rows.includes('osign')?' Run supabase-update-teacher-attendance.sql in Supabase.':'';
        toast(/row-level security|permission|42501/i.test(res.error.message+res.error.code)?'Not allowed by the database.'+(sqlHint||' Ask the owner.'):'Not saved: '+res.error.message);
        Q.shift();saveQueue();fetchAll();continue;
      }
      Q.shift();saveQueue();
    }
  }finally{flushing=false;syncBar();}
}

/* ================= Fee ledger ================= */
function paidMap(){if(!C.paid){C.paid={};S.payments.forEach(p=>{C.paid[p.studentId]=(C.paid[p.studentId]||0)+(Number(p.amount)||0);});}return C.paid;}
function chgMap(){if(!C.chg){C.chg={};S.charges.forEach(c=>{(C.chg[c.month]=C.chg[c.month]||[]).push(c);});}return C.chg;}
function feeHist(s){return (s.fees&&s.fees.length)?s.fees:[{from:'0000-00',fee:Number(s.fee||0),disc:Number(s.disc||0)}];}
function feeEntry(s,m){const h=feeHist(s);let e=h[0];h.forEach(x=>{if(x.from<=m)e=x;});return e;}
function feeAt(s,m){const e=feeEntry(s,m);return Math.max(0,Number(e.fee||0)-Number(e.disc||0));}
function startOf(s){if(s.feeFrom)return s.feeFrom;const sm=S.settings.startMonth||thisMonth();const am=monthOf(s.admit);return am&&am>sm?am:sm;}
function paysOf(id){if(!C.pays){C.pays={};S.payments.forEach(p=>{(C.pays[p.studentId]=C.pays[p.studentId]||[]).push(p);});Object.values(C.pays).forEach(l=>l.sort((a,b)=>(a.created||0)-(b.created||0)));}return C.pays[id]||[];}
/* Each student owes old dues + monthly fee + extra charges. Discounts lower a month's fee.
   Payments marked for certain months pay those months first; all other money pays the oldest dues first. */
function feeUpto(){const mode=S.settings.feeUpto||'auto';if(mode==='this')return thisMonth();if(mode==='next')return nextM(thisMonth());return new Date().getDate()>15?nextM(thisMonth()):thisMonth();}
function ledger(s,upto){
  upto=upto||feeUpto();C.led=C.led||{};const key=s.id+'|'+upto;if(C.led[key])return C.led[key];
  const start=startOf(s), end=(s.leftMonth&&s.leftMonth<upto)?s.leftMonth:upto, items=[], cm=chgMap();
  if(Number(s.opening)>0)items.push({m:'',title:'Old dues',amt:Number(s.opening)});
  for(let m=start;m<=end;m=nextM(m)){
    const f=feeAt(s,m);if(f>0)items.push({m,title:'Monthly fee',amt:f});
    (cm[m]||[]).forEach(c=>{if(c.target==='all'||(c.target==='class'&&c.cls===s.cls)||(c.target==='student'&&c.studentId===s.id))items.push({m,title:c.title,amt:Number(c.amount)||0});});
  }
  const pays=paysOf(s.id);
  items.forEach(i=>{i.full=i.amt;i.disc=0;i.paid=0;});
  let discTotal=0;
  pays.forEach(p=>{let d=Number(p.disc)||0;if(d<=0)return;
    const t=p.discMonth?items.filter(i=>i.m===p.discMonth):items;
    for(const i of t){if(d<=0)break;const k=Math.min(d,i.full-i.disc);if(k>0){i.disc+=k;d-=k;discTotal+=k;}}});
  items.forEach(i=>{i.amt=i.full-i.disc;});
  let pool=0,paid=0;
  pays.forEach(p=>{let a=Number(p.amount)||0;paid+=a;
    if(p.forMonths&&p.forMonths.length)for(const i of items){if(a<=0)break;if(!p.forMonths.includes(i.m))continue;const t=Math.min(a,i.amt-i.paid);if(t>0){i.paid+=t;a-=t;}}
    pool+=a;});
  for(const i of items){if(pool<=0)break;const t=Math.min(pool,i.amt-i.paid);if(t>0){i.paid+=t;pool-=t;}}
  const charged=sum(items,'amt');
  return C.led[key]={items,start,charged,paid,disc:discTotal,bal:charged-paid};

function monthInfo(s,m){

let MC=null;
function openClassSetup(){
  if(!MC){const k=UI.camp||'';MC={camp:k,rows:classes().map(c=>({orig:c,name:c,fee:classFee(c)||'',secs:[...((S.settings.sections||{})[(k?k+'::':'')+c]||[])]}))};}
  const k=MC.camp, cnt=c=>S.students.filter(s=>isActive(s)&&sameCls(s.cls,c)&&(s.campus||'')===k).length, cntAll=c=>S.students.filter(s=>isActive(s)&&sameCls(s.cls,c)).length;
  const secCnt=(c,x)=>S.students.filter(s=>isActive(s)&&sameCls(s.cls,c)&&(s.campus||'')===k&&String(s.sec||'').toUpperCase()===x).length;
  sheet(`<div class="shhd" style="--a1:#7c3aed;--a2:#a78bfa"><span class="aic sm" style="--a1:#a78bfa;--a2:#7c3aed">⚙️</span><div><b>Manage classes</b><small>Name, order, fee and sections</small></div></div>

    <div class="mcmid"><input class="mcname" value="${esc(r.name)}" onchange="MC.rows[${i}].name=this.value.trim()||MC.rows[${i}].orig" aria-label="Class name">
      <div class="mcsecs">${r.secs.map(x=>`<span>${esc(x)}${secCnt(r.orig,x)?` <small>${secCnt(r.orig,x)}</small>`:`<button onclick="mcSecDel(${i},'${esc(x)}')" aria-label="Remove section ${esc(x)}">×</button>`}</span>`).join('')}<button class="mcadd" onclick="mcSecAdd(${i})">＋ section</button></div></div>
    <div class="mcend"><label class="mcfee">Rs<input type="number" inputmode="numeric" value="${esc(r.fee)}" placeholder="0" onchange="MC.rows[${i}].fee=this.value" aria-label="Fee of ${esc(r.name)}"></label>
      <small>${pl(n,'student')}</small>${n?'':`<button class="mcdel" onclick="mcDel(${i})" aria-label="Delete ${esc(r.name)}">🗑</button>`}</div>
  </div>`;}).join('')}</div>
  <button class="btn sm ghost" style="margin-top:8px" onclick="MC=null;closeSheet();openNewClass()">＋ New class</button>
  <p class="note">Renaming a class updates its students, teachers and attendance. Only classes with no students can be deleted.</p>
  <p id="mc_err" class="err"></p>
  <div class="actions"><button class="btn ghost" onclick="MC=null;closeSheet()">Cancel</button><button class="btn" style="--c1:#7c3aed;--c2:#a78bfa" onclick="mcSave()">✓ Save classes</button></div>`);
}
function mcCamp(k){mcKeepInputs();MC.camp=k;MC.rows.forEach(r=>{r.secs=[...((S.settings.sections||{})[(k?k+'::':'')+r.orig]||[])];});openClassSetup();}
function mcKeepInputs(){document.querySelectorAll('.mcrow').forEach((el,i)=>{const n=el.querySelector('.mcname'),f=el.querySelector('.mcfee input');if(MC.rows[i]){if(n)MC.rows[i].name=n.value.trim()||MC.rows[i].orig;if(f)MC.rows[i].fee=f.value;}});}
function mcMove(i,d){mcKeepInputs();const r=MC.rows,j=i+d;if(j<0||j>=r.length)return;[r[i],r[j]]=[r[j],r[i]];openClassSetup();}
function mcDel(i){mcKeepInputs();const r=MC.rows[i];if(!confirm('Delete '+r.name+'?'))return;MC.rows.splice(i,1);openClassSetup();}
function mcSecAdd(i){mcKeepInputs();const r=MC.rows[i];const next=['A','B','C','D','E','F'].find(x=>!r.secs.includes(x))||'';const v=(prompt('New section for '+r.name+' (e.g. A, B, Blue)',next)||'').trim().toUpperCase();if(!v)return;if(!r.secs.includes(v))r.secs.push(v);r.secs.sort();openClassSetup();}
function mcSecDel(i,x){mcKeepInputs();MC.rows[i].secs=MC.rows[i].secs.filter(s=>s!==x);openClassSetup();}
function mcSave(){
  mcKeepInputs();
  const names=MC.rows.map(r=>r.name);
  if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){$('#mc_err').textContent='Two classes have the same name.';return;}
  // renames first (they update students, teachers and attendance)
  MC.rows.filter(r=>r.name!==r.orig).forEach(r=>{renameClassEverywhere(r.orig,r.name);});
  const fees={};MC.rows.forEach(r=>{const f=Math.round(Number(r.fee)||0);if(f)fees[r.name]=f;});
  const k=MC.camp, all={...(S.settings.sections||{})};
  MC.rows.forEach(r=>{const key=(k?k+'::':'')+r.name;delete all[(k?k+'::':'')+r.orig];if(r.secs.length)all[key]=r.secs;else delete all[key];});
  saveSettingsData({classes:names,classFees:fees,sections:all});
  toast('Classes saved');MC=null;closeSheet();render();
}

const sessY=d=>{const [y,m]=String(d).split('-').map(Number);return m>=3?y:y-1;};
function likelyCls(s){const base=s.admClass||s.cls, cl=classes();const lv=cl.findIndex(c=>sameCls(c,base));if(lv<0||!s.admit)return '';
  const n=lv+(sessY(todayStr())-sessY(s.admit));if(n<0)return cl[lv];return n>=cl.length?'Passed out':cl[n];}
let CP=null;
function openCurrentPicker(g){

  <div class="filters"><input type="search" placeholder="Search name, father, Adm No." value="${esc(CP.q)}" oninput="CP.q=this.value;cpList()">
  <select aria-label="Admission year" onchange="CP.year=this.value;cpList()"><option value="">All years</option>${[...new Set(S.students.map(s=>(s.admit||'').slice(0,4)).filter(Boolean))].sort().reverse().map(y=>`<option ${y===CP.year?'selected':''}>${y}</option>`).join('')}</select></div>

  <div class="list" id="cp_list"></div>
  <div class="sticky-act" style="bottom:0"><button class="btn wide" id="cp_save" onclick="cpSave()"></button></div>`);
  cpList();
}
function cpShown(){
  const g=CP.g, q=CP.q.trim().toLowerCase();
  return S.students.filter(s=>{
    if(UI.camp!==null&&(s.campus||'')!==UI.camp)return false;
    const cur=isActive(s)&&inGroup(s,g);
    if(!cur){if(isActive(s)){if(!(CP.from&&inGroup(s,CP.from)))return false;}else{if(s.wdDate&&!CP.wd)return false;if(CP.likely&&!sameCls(likelyCls(s),gCls(g)))return false;}}
    if(CP.year&&!(s.admit||'').startsWith(CP.year))return false;
    return !q||[s.name,s.father,s.admNo].some(v=>String(v||'').toLowerCase().includes(q));
  }).sort((a,b)=>(CP.sel.has(b.id)-CP.sel.has(a.id))||String(a.name).localeCompare(b.name));
}
function cpList(){
  const l=cpShown(), shown=l.slice(0,400);
  $('#cp_list').innerHTML=shown.map(s=>{const lk=likelyCls(s);return `<label class="item" style="cursor:pointer"><input type="checkbox" ${CP.sel.has(s.id)?'checked':''} onchange="if(this.checked)CP.sel.add('${s.id}');else CP.sel.delete('${s.id}');cpCount()">
    <div class="t"><div class="n">${esc(s.name)}</div><div class="s">${s.admNo?'Adm '+esc(s.admNo)+', ':''}${esc(s.father||'')}</div><div class="s">Admitted ${dmy(s.admit)||'?'} to ${esc(s.admClass||s.cls)}</div></div>
    <div class="r">${isActive(s)&&!inGroup(s,CP.g)?`<span class="chip part">Now in ${esc(gLabel(gOf(s)))}</span>`:isActive(s)?`<span class="chip paid">Studying</span>`:s.wdDate?`<span class="chip left">Withdrawn</span>`:`<span class="chip na">History</span>`}${lk?`<span class="s">Likely ${esc(lk)}</span>`:''}</div></label>`;}).join('')
    +(l.length>shown.length?`<p class="note">Showing 400 of ${l.length}. Search or pick a year.</p>`:'')||'<div class="empty card">Nobody here. Try "Whole register" or another year.</div>';
  cpCount();
}
function cpAll(on){cpShown().slice(0,400).forEach(s=>{if(on)CP.sel.add(s.id);else CP.sel.delete(s.id);});cpList();}
function cpCount(){$('#cp_n').textContent=pl(CP.sel.size,'student')+' in '+gLabel(CP.g);$('#cp_save').textContent=`Save ${gLabel(CP.g)} (${CP.sel.size})`;}
function cpSave(){
  const g=CP.g, c=gCls(g), sec=gSec(g), camp=gCamp(g), ups=[], fee=classFee(c), m=thisMonth();let added=0,removed=0;
  let roll=Number(nextRoll(c));
  S.students.forEach(s=>{
    const cur=isActive(s)&&inGroup(s,g), want=CP.sel.has(s.id);
    if(want&&!cur){
      const o={active:true,cls:c,sec,campus:camp,leftMonth:null,wdDate:'',wdClass:'',opening:0,roll:isActive(s)&&sameCls(s.cls,c)?s.roll:String(roll++)};
      if(!isActive(s)||!sameCls(s.cls,c)){o.fee=fee;o.disc=0;o.fees=[{from:'0000-00',fee,disc:0}];}
      ups.push([s.id,o]);added++;
    }else if(!want&&cur){ups.push([s.id,{active:false,leftMonth:prevM(m)}]);removed++;}
  });
  if(ups.length)updMany('students',ups);
  closeSheet();toast(`${gLabel(g)}: ${pl(CP.sel.size,'student')} studying${added?', '+added+' added':''}${removed?', '+removed+' moved to history':''}`);
  if(!fee&&added)setTimeout(()=>toast(`Set the monthly fee of ${c} in Settings so fee is counted.`),2900);
  CP=null;render();
}

function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const max=1600,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72));};
  img.onerror=()=>rej(new Error('This file is not a picture'));img.src=u;});}
async function savePhoto(file,studentId){
  if(!file)return;
  const s=studentId?getS(studentId):null;
  const title=prompt('Name for this photo',s?'Admission form, '+s.name:'Register page, '+niceDate(todayStr()));if(title===null)return;

    const o={id:'ph-'+uid(),title:title||'Photo',date:todayStr(),studentId:studentId||'',by:ME.name,img};
    if(ONLINE){
      if(!navigator.onLine){toast('Internet is needed to save a photo');return;}
      const {error}=await sb.from('records').insert({id:o.id,col:'photo',cls:null,data:clean(o),updated_at:new Date().toISOString()});

}

function renameCampusEverywhere(oldK,newK){
  const swapG=g=>gCamp(g)===oldK?gKey(gCls(g),gSec(g),newK):g;
  const set=S.settings, secs={};
  Object.entries(set.sections||{}).forEach(([key,v])=>{secs[key.startsWith(oldK+'::')?newK+'::'+key.slice(oldK.length+2):key]=v;});
  saveSettingsData({campuses:(set.campuses||[]).map(x=>x===oldK?newK:x),sections:secs});
  const su=S.students.filter(s=>(s.campus||'')===oldK).map(s=>[s.id,{campus:newK}]);if(su.length)updMany('students',su);
  S.staff.forEach(t=>{const cs=(t.classes||[]).map(swapG);if(JSON.stringify(cs)!==JSON.stringify(t.classes||[]))upd('staff',t.id,{classes:cs});});
  S.attendance.filter(a=>gCamp(a.cls)===oldK).forEach(a=>{const g=swapG(a.cls);put('attendance',attId(a.date,g),{...a,cls:g});if(attId(a.date,g)!==a.id)del('attendance',a.id);});
  const pu=S.payments.filter(p=>p.grp&&gCamp(p.grp)===oldK).map(p=>[p.id,{grp:swapG(p.grp)}]);if(pu.length)updMany('payments',pu);
  if(UI.camp===oldK)UI.camp=newK;
}

}

/* ================= Add current students from a class list ================= */
/* Read names from a photo, an Excel sheet or typed text, find each one in the Student Record, and add them to a class. */
let MT=null;
function loadOCR(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
    s.onload=()=>res(window.Tesseract);s.onerror=()=>rej(new Error('Could not load the photo reader. Check internet.'));document.head.appendChild(s);});
}
const SVG_CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const SVG_XL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg>';
const SVG_TXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
function openMatch(g){
  const gs=allGroups(UI.camp);g=g||(UI.cls&&gs.includes(UI.cls)?UI.cls:gs[0]);

    <button onclick="openCurrentPicker($('#mt_g').value)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l2 2 3-3M7 15l2 2 3-3M14 10h4M14 16h4"/></svg>Tick from record</button>

function mtTypeBox(){
  $('#mt_area').innerHTML=`<label>One student per line. Add father's name or Adm No. if you can.<textarea id="mt_txt" rows="9" placeholder="Ali Khan s/o Gul Rahman&#10;Ayesha, Sher Muhammad&#10;1523 Hamza"></textarea></label>
  <div class="actions"><button class="btn" onclick="mtLines($('#mt_txt').value.split('\\n'))">Find these students</button></div>`;

async function mtPhoto(file){
  if(!file)return;
  $('#mt_area').innerHTML=`<p class="note" style="margin-top:12px" id="mt_msg">Getting the photo reader ready...</p><div class="prog"><i id="mt_bar"></i></div>`;
  try{
    const T=await loadOCR();
    const img=await shrinkImage(file);
    const res=await T.recognize(img,'eng',{logger:m=>{if(m.status==='recognizing text'){$('#mt_msg').textContent='Reading names... '+Math.round(m.progress*100)+'%';$('#mt_bar').style.width=Math.round(m.progress*100)+'%';}else if($('#mt_msg'))$('#mt_msg').textContent=m.status.replace(/^./,c=>c.toUpperCase())+'...';}});
    const lines=(res.data.text||'').split('\n');
    if(!lines.some(l=>/[a-z]{3}/i.test(l))){$('#mt_area').innerHTML='<p class="err">No names could be read from this photo. Try a sharper photo in good light, or use Type names.</p>';return;}
    mtLines(lines,'photo');
  }catch(e){$('#mt_area').innerHTML=`<p class="err">${esc(e.message||e)}</p>`;}
}
async function mtExcel(file){
  if(!file)return;
  try{
    const X=await loadXLSX(), wb=X.read(await file.arrayBuffer(),{type:'array'});
    const rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false,defval:''});
    const hi=findHeaderRow(rows), map=guessMap(rows[hi]||[]);
    let lines;
    if(map.name!==undefined)lines=rows.slice(hi+1).map(r=>[map.admNo!==undefined?cellStr(r[map.admNo]):'',cellStr(r[map.name]),map.father!==undefined?'s/o '+cellStr(r[map.father]):''].join(' ').trim());
    else lines=rows.map(r=>r.map(cellStr).filter(Boolean).join(' '));
    mtLines(lines,'excel');
  }catch(e){$('#mt_area').innerHTML=`<p class="err">Could not read this file: ${esc(e.message||e)}</p>`;}
}
/* ---- name matching ---- */
function nn(s){return String(s||'').toLowerCase().replace(/\b(mohammad|mohammed|muhammed|mohamad|mohd|muhamad|mhd)\b/g,'muhammad').replace(/\b(m)\.?\s/g,'muhammad ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();}
function bigrams(s){s=s.replace(/ /g,'');const b=new Map();for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);b.set(k,(b.get(k)||0)+1);}return b;}
function dice(a,b){if(!a||!b)return 0;if(a===b)return 1;const A=bigrams(a),B=bigrams(b);let n=0,ta=0,tb=0;A.forEach(v=>ta+=v);B.forEach(v=>tb+=v);A.forEach((v,k)=>{if(B.has(k))n+=Math.min(v,B.get(k));});return ta+tb?2*n/(ta+tb):0;}
function nameSim(a,b){a=nn(a);b=nn(b);if(!a||!b)return 0;const d=dice(a,b);const ta=a.split(' '),tb=b.split(' ');const tok=ta.filter(t=>t.length>1&&tb.some(u=>u===t||(t.length>3&&dice(t,u)>.8))).length/Math.max(ta.length,tb.length);return Math.max(d,tok*.95);}
function parseLine(l){
  let s=String(l||'').replace(/[|_]/g,' ').trim();if(!s)return null;
  let adm='';const m=s.match(/\b(\d{1,5})\b/);if(m){adm=m[1];}
  s=s.replace(/^\s*\d{1,3}\s*[.)\-:]?\s+/,'');
  let name=s, father='';
  const sp=s.split(/\s+(?:s\/o|d\/o|s\.o|d\.o|son of|daughter of|bin|bint)\s+|\s*[,;\t]\s*|\s+-\s+/i);
  if(sp.length>1){name=sp[0];father=sp.slice(1).join(' ');}
  name=name.replace(/\d+/g,' ').replace(/\s+/g,' ').trim();father=father.replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
  if(!/[a-z]{2}/i.test(name))return null;
  if(/^(name|names|student|students|roll|class|section|s\.?\s*no|sr|total|father|attendance|register|month)\b/i.test(name))return null;
  return {raw:String(l).trim(),name,father,adm};
}
function mtCandidates(p,g){
  const pool=S.students.filter(s=>UI.camp===null||(s.campus||'')===UI.camp);
  const out=pool.map(s=>{let sc=nameSim(p.name,s.name);
    if(p.father){sc=sc*.7+nameSim(p.father,s.father)*.3;}
    if(p.adm&&String(s.admNo)===p.adm)sc=Math.min(1,sc+.35);
    if(sameCls(likelyCls(s),gCls(g)))sc+=.06;
    if(isActive(s)&&inGroup(s,g))sc+=.04;
    if(s.wdDate&&!isActive(s))sc-=.1;
    return {s,sc};}).filter(x=>x.sc>.45).sort((a,b)=>b.sc-a.sc).slice(0,6);
  return out;
}
function mtLines(lines,src){
  const g=$('#mt_g').value;MT.g=g;
  const parsed=lines.map(parseLine).filter(Boolean);
  if(!parsed.length){$('#mt_area').innerHTML='<p class="err">No names found.</p>';return;}
  const used=new Set();
  MT.rows=parsed.map(p=>{const c=mtCandidates(p,g);let pick=c.find(x=>!used.has(x.s.id));
    const ok=pick&&pick.sc>=.78&&(c.length<2||c[0].s.id!==pick.s.id||c[0].sc-(c[1]||{sc:0}).sc>.04||pick.sc>=.95);
    if(pick&&pick.sc>=.6)used.add(pick.s.id);
    const wd=pick&&pick.s.wdDate&&!isActive(pick.s);
    return {p,c,id:pick&&pick.sc>=.6?pick.s.id:'',on:!!(pick&&pick.sc>=.6&&!wd),sure:!!ok&&!wd};});
  mtShow();
}
function mtShow(){
  const g=MT.g, found=MT.rows.filter(r=>r.id).length, check=MT.rows.filter(r=>r.id&&!r.sure).length, none=MT.rows.length-found;
  $('#mt_area').innerHTML=`<div class="balbox good" style="margin-top:12px"><span>${pl(MT.rows.length,'name')} read</span><b>${found} found</b>
    <span>${check?check+' to check (marked in orange), ':''}${none?none+' not found':'all names found'}</span></div>
  ${found?`<div class="toprow" style="margin-top:10px"><b id="mt_n"></b><span class="gap"><button class="btn sm ghost" onclick="MT.rows.forEach(r=>{if(r.id)r.on=true});mtShow()">✓ Select all</button><button class="btn sm ghost" onclick="MT.rows.forEach(r=>r.on=false);mtShow()">✗ None</button></span></div>`:''}
  <div class="card" style="padding:0 12px;margin-top:10px">${MT.rows.map((r,i)=>`<div class="mt-row"><input type="checkbox" ${r.on&&r.id?'checked':''} ${r.id?'':'disabled'} onchange="MT.rows[${i}].on=this.checked;mtCount()" aria-label="Add">
    <div class="t"><div class="src">From list: <b style="color:var(--ink)">${esc(r.p.raw)}</b></div>
    <select onchange="MT.rows[${i}].id=this.value;MT.rows[${i}].on=!!this.value;MT.rows[${i}].sure=true;mtShow()" style="${r.id&&!r.sure?'border-color:var(--part);background:var(--partbg)':''}">
      <option value="">${r.c.length?'Not this one / no match':'No match in the record'}</option>
      ${r.c.map(x=>`<option value="${x.s.id}" ${x.s.id===r.id?'selected':''}>${esc(x.s.name)}${x.s.father?' s/o '+esc(x.s.father):''}${x.s.admNo?', Adm '+esc(x.s.admNo):''}${isActive(x.s)?' ('+esc(gLabel(gOf(x.s)))+')':x.s.wdDate?' (withdrawn '+dmy(x.s.wdDate)+')':''}</option>`).join('')}
    </select></div></div>`).join('')}</div>
  <label class="check" style="margin-top:12px"><input type="checkbox" ${MT.moveOut?'checked':''} onchange="MT.moveOut=this.checked"> Students now in ${esc(gLabel(g))} who are not on this list move to history</label>
  <div class="actions"><button class="btn ghost" onclick="openMatch('${esc(g)}')">Start again</button><button class="btn green" id="mt_save" onclick="mtSave()"></button></div>`;
  mtCount();
}
function mtCount(){const n=MT.rows.filter(r=>r.on&&r.id).length;$('#mt_save').textContent=`Add ${pl(n,'student')} to ${gLabel(MT.g)}`;const e=$('#mt_n');if(e)e.textContent=`${n} of ${MT.rows.filter(r=>r.id).length} ticked`;}
function mtSave(){
  const ids=[...new Set(MT.rows.filter(r=>r.on&&r.id).map(r=>r.id))];if(!ids.length){toast('Tick at least one student');return;}
  CP={g:MT.g,sel:new Set(ids.concat(MT.moveOut?[]:classStudents(MT.g).map(s=>s.id))),likely:true,wd:false,q:'',year:''};
  MT=null;cpSave();
}

async function certPdf(send){

    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js','html2canvas');
    await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js','jspdf');

    const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;';host.innerHTML=certHtml(UI.ctype,UI.cdata);document.body.appendChild(host);

function ofSim(fn){
  const real=S.payments, realSt=S.students;
  S.payments=real.filter(p=>!OF.rem.has(p.id)).concat(OF.pend);
  OF.open=OF.open||{};
  if(Object.keys(OF.fees).length||Object.keys(OF.from).length||Object.keys(OF.open).length)S.students=realSt.map(s=>{let o=s;
    if(OF.fees[s.id]!==undefined)o={...o,fee:OF.fees[s.id],disc:0,fees:[{from:'0000-00',fee:OF.fees[s.id],disc:0}]};
    if(OF.from[s.id])o={...o,feeFrom:OF.from[s.id]};
    if(OF.open[s.id]!==undefined)o={...o,opening:OF.open[s.id]};return o;});
  C={};try{return fn();}finally{S.payments=real;S.students=realSt;C={};}

function ofCell(s,m){
  const now=thisMonth(), am=monthOf(s.admit);
  if(m>now)return {k:'fut'};
  if(s.leftMonth&&m>s.leftMonth)return {k:'na'};
  const L=ledger(s,now);
  const cash=sum(paysOf(s.id).filter(p=>monthOf(p.date)===m),'amount');
  if(m<L.start)return {k:'pre',cash};
  const its=L.items.filter(i=>i.m===m), a=sum(its,'amt'), pd=sum(its,'paid');
  if(a<=0)return {k:'f',cash};
  return {k:pd>=a?'p':pd>0?'h':'d',a,pd,cash};
}

function ofSetAmount(id,m,amt){

  if(saved.some(p=>!p.old)){toast('This month has a normal fee receipt. Change it from the receipt.');return false;}
  if(saved.length&&!isOwner()){toast('This month is saved. Ask the owner to change it.');return false;}

function owedUpTo(s,m){const L=ledger(s,thisMonth());const its=L.items.filter(i=>i.m&&i.m<=m);return {amt:sum(its,i=>Math.max(0,i.amt-i.paid)),months:[...new Set(its.filter(i=>i.paid<i.amt).map(i=>i.m))]};}
function ofTap(id,m){
  const s=getS(id);
  const c=ofSim(()=>ofCell(getS(id),m));
  const pend=OF.pend.filter(p=>p.studentId===id&&monthOf(p.date)===m);
  const saved=ofSim(()=>paysOf(id).filter(p=>monthOf(p.date)===m&&!String(p.id).startsWith('pend-')));
  // month already has money in it: change the amount
  if(pend.length||saved.length){
    if(saved.length&&!isOwner()){toast('This month is saved. Ask the owner to change it.');return;}
    if(saved.some(p=>!p.old)){toast('This month has a normal fee receipt. Change it from the receipt.');return;}
    const curAmt=sum(pend,'amount')+sum(saved,'amount');
    const v=prompt(`${s.name}, fee paid in ${mShort(m)} (Rs). Write 0 to remove.`,curAmt);if(v===null)return;
    const amt=Math.max(0,Math.round(Number(v)||0));
    OF.pend=OF.pend.filter(p=>!(p.studentId===id&&monthOf(p.date)===m));saved.forEach(p=>OF.rem.add(p.id));
    if(amt>0)ofSetAmount(id,m,amt);
    render();return;
  }
  if(c.k==='pre'){
    // start counting fee for this student from this month
    OF.from[id]=m;
  }else if(c.k==='p'){toast('Already covered by an earlier payment. Tap a month with an amount to change it.');return;}
  const o=ofSim(()=>owedUpTo(getS(id),m));
  if(o.amt<=0){toast('Nothing owed up to '+mShort(m));render();return;}
  OF.pend.push({id:'pend-'+uid(),studentId:id,amount:Math.round(o.amt),date:midDay(m),forMonths:o.months.filter(Boolean).sort(),old:true,created:Date.now()+OF.pend.length});

  render();

    const o={studentId:s.id,name:s.name,father:s.father||'',cls:s.cls,sec:s.sec||'',grp:gOf(s),roll:s.roll||'',amount:p.amount,date:p.date,
      method:'Old record',note:'Paid in '+mShort(m),forMonths:p.forMonths||undefined,receiptNo:rn++,prevBal:L.bal,disc:0,newBal:L.bal-p.amount,covers:monthsText(cov)||mShort(m),
      by:isOwner()?(S.settings.accountant||ME.name):ME.name,byUid:ME.uid,settled:true,old:true,created:Date.now()+pays.length};
    if(!o.forMonths)delete o.forMonths;pays.push(o);S.payments.push({...o,id:'tmp-'+pays.length});C={};
  });
  S.payments=S.payments.filter(p=>!String(p.id).startsWith('tmp-'));C={};

}

const PH_STYLES=[['green','Green'],['gold','Gold'],['round','Rounded'],['oval','Oval'],['plain','Plain']];
function afCropUI(){
  sheet(`<h3>📸 Adjust photo</h3><p class="muted">Drag to move. Use the slider to zoom. Keep the face in the middle.</p>

function pcGeom(W,H){const img=PC.img, s=Math.max(W/img.width,H/img.height)*PC.z, w=img.width*s, hh=img.height*s;

/* ================= Rename a class everywhere (used once: Prep -> KG) ================= */
function renameClassEverywhere(oldC,newC){
  const same=c=>String(c||'').trim().toLowerCase()===oldC.toLowerCase();
  const swapG=g=>same(gCls(g))?gKey(newC,gSec(g),gCamp(g)):g;
  // settings
  const set=S.settings, cl=(set.classes||[]).slice();
  const i=cl.findIndex(same);if(i>=0){if(cl.some(c=>c===newC))cl.splice(i,1);else cl[i]=newC;}
  const fees={...(set.classFees||{})};Object.keys(fees).forEach(k=>{if(same(k)){if(!fees[newC])fees[newC]=fees[k];delete fees[k];}});
  const secs={};Object.entries(set.sections||{}).forEach(([k,v])=>{const nk=k.split('::').map(x=>same(x)?newC:x).join('::');secs[nk]=v;});
  saveSettingsData({classes:cl,classFees:fees,sections:secs,prepToKg:true});
  // students
  const su=[];S.students.forEach(s=>{const o={};['cls','admClass','wdClass','preClass'].forEach(f=>{if(same(s[f]))o[f]=newC;});if(Object.keys(o).length)su.push([s.id,o]);});
  if(su.length)updMany('students',su);
  // teachers' classes
  S.staff.forEach(t=>{const cs=(t.classes||[]).map(swapG);if(JSON.stringify(cs)!==JSON.stringify(t.classes||[]))upd('staff',t.id,{classes:cs});});
  // attendance: re-key the days of that class
  const old=S.attendance.filter(a=>same(gCls(a.cls)));
  old.forEach(a=>{const g=swapG(a.cls);put('attendance',attId(a.date,g),{...a,cls:g});if(attId(a.date,g)!==a.id)del('attendance',a.id);});
  // payments: class label
  const pu=[];S.payments.forEach(p=>{const o={};if(same(p.cls))o.cls=newC;if(p.grp&&same(gCls(p.grp)))o.grp=swapG(p.grp);if(Object.keys(o).length)pu.push([p.id,o]);});
  if(pu.length)updMany('payments',pu);
  toast(`${oldC} is now ${newC} everywhere`);
}

function preParse(line){
  let t=line.replace(/^\s*\d+[\).\-\s]+/,'').trim();if(!t)return null;
  const ph=(t.match(/0?3\d{2}[\s\-]?\d{7}/)||[''])[0];if(ph)t=t.replace(ph,'');
  let name=t,father='';
  const m=t.match(/^(.*?)\s+(?:s\/o|d\/o|son of|daughter of|bin|bint)\s+(.*)$/i);
  if(m){name=m[1];father=m[2];}else{const p=t.split(/[,\t;|]+/).map(x=>x.trim()).filter(Boolean);name=p[0]||'';father=p[1]||'';}
  name=name.replace(/[,\-]+$/,'').trim().toUpperCase();father=father.replace(/[,\-]+$/,'').trim().toUpperCase();
  return name?{name,father,phone:ph.replace(/\D/g,'').replace(/^(\d{4})/,'$1-')}:null;
}

    gender:guessSex({name:x.name})==='F'?'F':'M'}));

async function readPreExcel(file){

    const out=rows.slice(hi+1).map(r=>{const name=String(r[ci.name]||'').trim();if(!name||/total/i.test(name))return null;

      return {name:name.toUpperCase(),father:ci.father>=0?String(r[ci.father]||'').trim().toUpperCase():'',phone:ci.phone>=0?String(r[ci.phone]||'').trim():'',cls:ci.cls>=0?fixCls(r[ci.cls]):def,addr:ci.addr>=0?String(r[ci.addr]||'').trim():'',date:dd};}).filter(Boolean);
    PX=out;

      <div class="actions"><button class="btn ghost" onclick="openPreBring()">Back</button><button class="btn green" onclick="savePreExcel()">Add ${kidsTxt(out.length)}</button></div>`;

function obPrefix(){return (String(S.settings.school||'School').split(/\s+/).map(w=>w[0]).join('').toUpperCase().replace(/[^A-Z]/g,''))||'SCH';}
function obNextNo(){const y=new Date().getFullYear();return S.orders.filter(o=>String(o.year)===String(y)).reduce((m,o)=>Math.max(m,Number(o.seq)||0),0)+1;}

function obForMe(o){return o.to==='all'||(o.toIds||[]).includes(ME.uid);}
function obMySign(id){return S.osign.find(s=>s.orderId===id&&s.byUid===ME.uid&&s.sig);}
function obRecips(o){const l=o.to==='all'?S.staff.filter(t=>t.active!==false).map(t=>({id:t.id,name:t.name,phone:t.phone})):(o.toIds||[]).map(id=>{const t=S.staff.find(x=>x.id===id);return {id,name:t?t.name:(o.toNames||{})[id]||'Teacher',phone:t&&t.phone};});
  if(o.to==='all'&&!l.length&&o.toNames)return Object.entries(o.toNames).map(([id,name])=>({id,name}));return l;}
function obSigns(o){const m={};S.osign.filter(s=>s.orderId===o.id).forEach(s=>m[s.byUid]=s);return m;}
function obPending(){return ME&&!isOwner()?S.orders.filter(o=>o.status!=='closed'&&obForMe(o)&&!obMySign(o.id)):[];}
function psPending(){return ME&&!isOwner()?S.payroll.filter(x=>x.tid===ME.uid&&!psSigned(x.id)):[];}
const psSigned=id=>S.osign.find(s=>s.orderId===id&&s.sig);
function obHeader(){const b=$('#obBell');if(!b)return;b.hidden=!ME||isOwner();if(b.hidden)return;const n=obPending().length+psPending().length;const g=$('#obBadge');g.hidden=!n;g.textContent=n;b.classList.toggle('ring',!!n);
  if(n&&!obHeader.done){obHeader.done=true;setTimeout(()=>obPending().length?obAlert(false):psAlert(false),700);}}
/* chime */
function obChime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=obChime.c||(obChime.c=new A());if(c.state==='suspended')c.resume();
  [[784,0],[988,.18],[1175,.36],[988,.62],[1175,.8]].forEach(([f,t])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);
    const s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.5);o.start(s);o.stop(s+.55);});
  if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
document.addEventListener('pointerdown',()=>{if(obChime.wait){obChime.wait=false;obChime();}},{capture:true});
function obAlert(live){

  sheet(`<div class="obal" style="--a1:${a1};--a2:${a2}"><div class="obbellbig">🔔</div><b>${live?'New order received':'You have '+(l.length>1?l.length+' orders':'an order')+' to sign'}</b><span>${esc(o.by||'Director')} · ${dmy(o.date)}</span></div>
  <div class="obmini"><span class="obti">${obT(o.type)[1]}</span><div><b ${o.lang==='ur'?'dir="rtl" class="ur"':''}>${esc(o.subject)}</b><small>${obNoTxt(o)}${o.urgent?' · <em>URGENT</em>':''}</small></div></div>

}

/* remove the paper, keep the ink in one solid colour, cut away empty space */
function sgProcess(){
  const im=SG.img;if(!im)return;
  const k=Math.min(1,1400/Math.max(im.width,im.height)), W=Math.round(im.width*k), H=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(im,0,0,W,H);
  const d=g.getImageData(0,0,W,H), px=d.data, n=W*H, L=new Uint8Array(n);
  for(let i=0;i<n;i++)L[i]=(px[i*4]*.299+px[i*4+1]*.587+px[i*4+2]*.114)|0;
  // local background: blurred brightness on a coarse grid (copes with shadows on the paper)
  const cs=24, gw=Math.ceil(W/cs), gh=Math.ceil(H/cs), bg=new Float32Array(gw*gh);
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){const v=[];for(let y=gy*cs;y<Math.min(H,(gy+1)*cs);y+=3)for(let x=gx*cs;x<Math.min(W,(gx+1)*cs);x+=3)v.push(L[y*W+x]);v.sort((a,b)=>a-b);bg[gy*gw+gx]=v[Math.floor(v.length*.8)]||255;}
  // Otsu on the difference from the background

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x, b=bg[Math.min(gh-1,(y/cs)|0)*gw+Math.min(gw-1,(x/cs)|0)], dv=Math.max(0,Math.min(255,b-L[i]));diff[i]=dv;hist[dv]++;}
  let sumT=0;for(let t=0;t<256;t++)sumT+=t*hist[t];let wB=0,sB=0,best=0,th=40;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sumT-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=t;}}
  th=Math.max(14,Math.min(120,th-SG.lv));
  const [cr,cg,cb]=[1,3,5].map(o=>parseInt(SG.col.substr(o,2),16));
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,dv=diff[i];

    else px[i*4+3]=0;}
  g.putImageData(d,0,0);
  const out=$('#sgout');
  if(x1<0){SG.out='';if(out){out.width=300;out.height=80;const o=out.getContext('2d');o.font='16px sans-serif';o.fillStyle='#b91c1c';o.fillText('No ink found. Try another photo.',10,45);}return;}
  const pad=10;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
  const cw=x1-x0+1,ch=y1-y0+1,sc=Math.min(1,600/cw,220/ch), fw=Math.round(cw*sc), fh=Math.round(ch*sc);
  const f=document.createElement('canvas');f.width=fw;f.height=fh;const fg=f.getContext('2d');fg.imageSmoothingQuality='high';fg.drawImage(c,x0,y0,cw,ch,0,0,fw,fh);

  if(out){out.width=fw;out.height=fh;out.getContext('2d').drawImage(f,0,0);}
}

async function obAi(task){
  const N=OBN, key=obAiKey();
  const ask={polish:'Correct every spelling, grammar and punctuation mistake and rewrite this as a clear, formal, standard office order of a Pakistani school. Keep the SAME language as the text ('+(N.lang==='ur'?'Urdu, in Urdu script':'English')+'). Keep every fact, date, time, place and name. Use short numbered points if there are several instructions. Start with a standard opening line and end with a standard closing line such as "All concerned are directed to comply." Make the subject short and clear.',
    formal:'Rewrite this school office order in clear, formal, polite language suitable for a Pakistani school. Keep all facts, dates and names.',
    fix:'Correct the spelling, grammar, capital letters and punctuation. Do not change the meaning.',
    points:'Rewrite the instructions as short numbered points under a one-line introduction.',
    short:'Make this order shorter and clearer. Keep every fact, date and time.',
    translate:N.lang==='ur'?'Translate this school order into clear formal English.':'Translate this school order into clear formal Urdu (Urdu script).'}[task];
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:1200,system:'You edit official orders for '+(S.settings.school||'a school')+'. Reply ONLY with JSON: {"subject":"...","body":"..."}. No other text.',
      messages:[{role:'user',content:ask+'\n\nSubject: '+N.subject+'\n\nText:\n'+N.body}]})});
  if(!r.ok)throw new Error(r.status===401?'The AI key is not correct':'AI is not available now ('+r.status+')');
  const d=await r.json(), t=(d.content||[]).map(x=>x.text||'').join('').replace(/```json|```/g,'').trim();
  const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  return j;
}
function obFixText(s){
  const W={'pls':'please','plz':'please','u':'you','ur':'your','r':'are','tmrw':'tomorrow','tomorow':'tomorrow','asap':'at the earliest','govt':'government','info':'information','abt':'about','msg':'message','thx':'thanks','tchr':'teacher','tchrs':'teachers','stds':'students','std':'student','recieve':'receive','seperate':'separate','untill':'until','occured':'occurred','definately':'definitely','attendence':'attendance','accomodate':'accommodate','begining':'beginning','succesful':'successful','wednsday':'Wednesday','i':'I','dont':'do not','cant':'cannot','wont':'will not','isnt':'is not','didnt':'did not','doesnt':'does not','shouldnt':'should not','im':'I am','pls.':'please'};
  return s.split('\n').map(line=>{let l=line.replace(/\s+/g,' ').replace(/\s+([,.!?;:])/g,'$1').replace(/([,.!?;:])(?=[A-Za-z])/g,'$1 ');
    l=l.replace(/\b[A-Za-z]+\b/g,w=>{const k=w.toLowerCase();return W[k]!==undefined&&(k!=='r'&&k!=='u'||w.length===1)?W[k]:w;});

    l=l.replace(/(^\s*(?:\d+[.)]\s*)?|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
    l=l.replace(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|june|july|august|september|october|november|december)\b/gi,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
    return l.trim();}).join('\n').replace(/([^.!?:\n])\n\n/g,'$1.\n\n').replace(/([^.!?:\s])$/,'$1.');
}
function obFormal(s){
  let t=obFixText(s).trim();

  if(!open)t='It is hereby informed that '+t.replace(/^./,c=>c.toLowerCase());
  t=t.replace(/\bplease\s+/gi,'').replace(/(^|[.!?]\s+)do not be late\b/gi,'$1No one shall be late').replace(/(^|[.!?]\s+)do not\b/gi,'$1Teachers shall not').replace(/\bdo not be\b/gi,'shall not be').replace(/\bdo not\b/gi,'shall not').replace(/\bmust\b/g,'are directed to').replace(/\b(teachers|staff|students)\s+come\b/gi,'$1 shall report').replace(/\bcome\b/g,'report').replace(/\bthanks\.?$/i,'').replace(/(^|\.\s+)(bring|send|submit|keep|ensure|report)\b/gi,(m,a,b)=>a+'All teachers shall '+b.toLowerCase());

function obPoints(s){
  const parts=obFixText(s).replace(/\n+/g,' ').split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);

/* ---- one-tap polish with undo ---- */

async function obTool(task){

    const hd=rows[hi].map(x=>String(x).toLowerCase().trim()), col=re=>hd.findIndex(x=>re.test(x));
    const ci={adm:col(/adm|reg|roll no|file/),name:col(/^(student|name)|name of|student name|^name$/),father:col(/father|parent|guardian/),bal:col(/balance|arrear|dues|baqaya|amount/)};
    if(ci.name<0)ci.name=hd.findIndex(x=>/name/.test(x)&&!/father/.test(x));

      ${miss.length?`<details style="margin-top:8px"><summary class="c-due">${pl(miss.length,'row')} not matched</summary><div class="inner">${miss.map(x=>`<div>${esc(x.name)}: ${rs(x.bal)}</div>`).join('')}</div></details>`:''}
      <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button><button class="btn green" ${ch.length?'':'disabled'} onclick="saveOldBalExcel()">✓ Save ${ch.length} old balances</button></div>`;
  }catch(e){toast('Could not read this file: '+(e.message||e));}
}

const distM=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),s=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(s));};
const hhmm=iso=>iso?new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'';
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('This phone cannot share its location.'));
  navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(new Error(e.code===1?'Location is blocked. Allow location for this app in the phone settings.':'Could not find your location. Turn on GPS / Location and try again.')),{enableHighAccuracy:true,timeout:20000,maximumAge:0});});}
function cpGeoHere(){const t=$('#cp_geotxt');t.textContent='Finding your location...';
  getPos().then(c=>{$('#cp_ll').value=c.latitude.toFixed(6)+', '+c.longitude.toFixed(6);t.innerHTML=`Found: accurate to about ${Math.round(c.accuracy)} m. Tap Save to keep it.`;}).catch(e=>{t.textContent=e.message;});}
function myCampuses(){const ks=[...new Set((ME.classes||[]).map(gCamp))];return ks.length?ks:[''];}

const myTA=d=>S.tatt.find(a=>a.id===(d||todayStr())+'_'+ME.uid);
function tRules(){const s=S.settings, r=s.tRules||{};return {start:r.start||s.tStart||'08:00',end:r.end||'13:30',grace:r.grace??s.tGrace??15,lateMode:r.lateMode||'none',lateAmt:r.lateAmt??100,perMin:r.perMin??5,latesPerDay:r.latesPerDay??3,
  absent:r.absent??true,workDays:r.workDays||'auto',paidLeaves:r.paidLeaves??2};}
const tmMin=t=>{const [a,b]=String(t||'0:0').split(':').map(Number);return a*60+b;};
function lateBy(iso){if(!iso)return 0;const d=new Date(iso);return Math.max(0,d.getHours()*60+d.getMinutes()-tmMin(tRules().start));}
function isLate(iso){return lateBy(iso)>Number(tRules().grace);}

async function bioVerify(){
  if(!window.PublicKeyCredential||!navigator.credentials)throw new Error('This phone does not support fingerprint check in the browser.');
  const ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false);
  if(!ok)throw new Error('Set a fingerprint or face lock on this phone first (phone Settings > Security).');
  const key='gvps-bio-'+ME.uid;let cid=null;try{cid=localStorage.getItem(key);}catch(e){}
  const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
  const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))), unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  if(!cid){
    const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:S.settings.school||'School'},user:{id:new TextEncoder().encode(ME.uid),name:ME.name||'teacher',displayName:ME.name||'Teacher'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}});
    cid=b64(cred.rawId);try{localStorage.setItem(key,cid);}catch(e){}
    return 'registered';
  }
  await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb(cid),transports:['internal']}],userVerification:'required',timeout:60000}});
  return 'verified';
}
async function markMyAtt(kind){
  const b=$('#maBtn'), msg=$('#maMsg');const say=(t,bad)=>{msg.textContent=t;msg.className='ma-msg'+(bad?' bad':' ok');};

    const slack=Math.min(c.accuracy||0,40);
    if(c.accuracy>250){b.disabled=false;say(`Your location is not exact (±${Math.round(c.accuracy)} m). Go to an open place and try again.`,true);return;}
    if(near.d-slack>near.g.r){b.disabled=false;say(`🚫 You are out of the school location (${near.d>=1000?(near.d/1000).toFixed(1)+' km':Math.round(near.d)+' m'} away). Come inside the school to mark attendance.`,true);obChimeLow();return;}
    say('👆 Touch the fingerprint sensor or look at the camera...');

  }catch(e){if(b)b.disabled=false;const t=String(e&&e.name||'');say(t==='NotAllowedError'?'Fingerprint check was cancelled. Try again.':t==='SecurityError'?'Fingerprint check needs the app opened from its normal https:// link.':(e.message||'Something went wrong'),true);}
}
function obChimeLow(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=obChime.c||(obChime.c=new A());const o=c.createOscillator(),g=c.createGain();o.frequency.value=220;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5);if(navigator.vibrate)navigator.vibrate([300]);}catch(e){}}

/* ---- salary for a month ---- */
function salCalc(t,m){
  const R=tRules(), today=todayStr();
  const recs=S.tatt.filter(a=>a.byUid===t.id&&a.date.startsWith(m)&&a.date<=today);
  const open=[...new Set(S.tatt.filter(a=>a.date.startsWith(m)&&a.date<=today&&(a.in||a.leave)).map(a=>a.date))];
  const pres=recs.filter(a=>a.in), lv=recs.filter(a=>a.leave&&!a.in).length;
  const absent=open.filter(d=>!recs.some(a=>a.date===d&&(a.in||a.leave))).length+Math.max(0,lv-R.paidLeaves);
  const lates=pres.filter(a=>isLate(a.in.at)), lateMins=sum(lates,a=>lateBy(a.in.at));
  const sal=Number(t.salary)||0, wd=R.workDays==='auto'?(open.length||26):Number(R.workDays), day=sal/wd;
  const lateDed=R.lateMode==='fixed'?lates.length*R.lateAmt:R.lateMode==='perMin'?lateMins*R.perMin:R.lateMode==='days'?Math.floor(lates.length/R.latesPerDay)*day:0;
  const absDed=R.absent?absent*day:0;
  const adj=(S.settings.salAdj||{})[m+'_'+t.id]||0;
  return {sal,open:open.length,pres:pres.length,lv:Math.min(lv,R.paidLeaves),lvAll:lv,absent,lates:lates.length,lateMins,lateDed:Math.round(lateDed),absDed:Math.round(absDed),adj,net:Math.max(0,Math.round(sal-lateDed-absDed+adj)),day:Math.round(day)};
}

function viewPayslip(){
  const pr=S.payroll.find(x=>x.id===UI.pay);if(!pr){go(isOwner()?'tsal':'fees');return;}
  const mine=!isOwner()&&pr.tid===ME.uid, sg=psSigned(pr.id);

  ${mine&&!sg?`<div class="obsignbox" style="--a1:#15803d;--a2:#4ade80"><b>✍️ Sign to confirm you received your salary</b><small>Your signature is saved on this pay slip.</small>
    <canvas id="obpad" width="600" height="220"></canvas><div class="actions"><button class="btn ghost" onclick="obPadClear()">Clear</button><button class="btn" style="--c1:#15803d;--c2:#4ade80" onclick="psSign('${pr.id}')">✓ Sign and submit</button></div></div>`
  :mine?`<div class="obsigned"><span>✓ You signed this pay slip</span><small>${new Date(sg.at).toLocaleString('en-GB')}</small></div>`:''}
  <div class="actions no-print"><button class="btn ghost" onclick="printAs('pr-cert')">🖨️ Print</button>${isOwner()?`<button class="btn sm red" onclick="if(confirm('Delete this pay roll? The fee cash will show again as with the teacher.')){payUndo('${pr.id}')}">Undo pay roll</button>`:''}</div>`;

function psSign(id){const c=$('#obpad');if(!c||!c._ink){toast('Please sign in the box first');return;}
  put('osign',id+'_'+ME.uid,{orderId:id,byUid:ME.uid,name:ME.name,seenAt:new Date().toISOString(),at:new Date().toISOString(),sig:obPadData(c)});OBPAD={key:'',strokes:[]};toast('✓ Signed. Thank you.');render();}
function payUndo(id){const pr=S.payroll.find(x=>x.id===id);if(!pr)return;
  const back=S.payments.filter(p=>p.byUid===pr.tid&&p.settledBy==='payroll '+pr.month);if(back.length)updMany('payments',back.map(p=>[p.id,{settled:false,settledAt:'',settledBy:''}]));
  S.osign.filter(s=>s.orderId===id).forEach(s=>del('osign',s.id));del('payroll',id);toast('Pay roll removed');go('tsal');}
function psAlert(live){const l=psPending();if(!l.length||UI.tab==='payslip')return;obChime();obChime.wait=true;const pr=l[0];
  sheet(`<div class="obal" style="--a1:#15803d;--a2:#4ade80"><div class="obbellbig">💵</div><b>${live?'Your pay slip is ready':'Please sign your pay slip'}</b><span>${monthName(pr.month)} · net salary Rs ${Math.round(pr.net).toLocaleString('en-PK')}</span></div>

function mySalaryCard(){

function taTime(id,kind){
  const d=UI.taDate||todayStr(), rid=d+'_'+id, a=S.tatt.find(x=>x.id===rid);if(!a)return;
  const cur=a[kind]?hhmm(a[kind].at):(kind==='out'?tRules().end:tRules().start);
  const v=prompt(`${kind==='in'?'Check-in':'Check-out'} time (HH:MM, 24 hours)`,cur);if(v===null)return;
  if(!/^\d{1,2}:\d{2}$/.test(v.trim())){toast('Write time like 08:05 or 13:30');return;}
  const [hh,mm]=v.trim().split(':').map(Number);if(hh>23||mm>59){toast('Not a correct time');return;}
  const [y,mo,dd]=d.split('-').map(Number), at=new Date(y,mo-1,dd,hh,mm).toISOString();
  if(kind==='out'&&a.in&&at<=a.in.at){toast('Out time must be after the in time');return;}
  put('tatt',rid,{...a,[kind]:{...(a[kind]||{bio:false,dist:0}),at,edited:ME.name}});closeSheet();toast('Time changed');
}
function taToLeave(id){const d=UI.taDate||todayStr(), rid=d+'_'+id, a=S.tatt.find(x=>x.id===rid);if(!a)return;
  if(!confirm('Change this day to paid leave? The check-in time will be removed.'))return;
  put('tatt',rid,{date:d,byUid:id,name:a.name,leave:true,by:ME.name});closeSheet();toast('Changed to leave');}
function taRemove(id){const d=UI.taDate||todayStr(), rid=d+'_'+id, a=S.tatt.find(x=>x.id===rid);if(!a)return;
  if(!confirm(`Remove ${a.name}'s attendance for ${dmy(d)}? The day will show as not checked in.`))return;

/* A separate login for one phone kept at school. Teachers tap their name, type their PIN,

let KS={list:[],t:null,pin:'',stream:null,busy:false,fails:{},msg:null,school:null};
async function kioskStart(){

async function kioskLoad(){

  catch(e){KS.err=isNetErr(e)?'No internet. Punches are saved and sent later.':(e.message||String(e));}

function viewKioskClock(){const c=$('#ksclock');if(c)c.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function viewKiosk(){
  const hb=$('#hBack');if(hb)hb.hidden=true;const nav=$('nav');if(nav)nav.hidden=true;
  {const sc=(KS.school&&KS.school.school)||S.settings.school;if(sc)$('#h_school').textContent=sc;$('#h_sub').innerHTML='Attendance phone<span class="role">📱 Kiosk</span>';}
  const d=new Date(), pend=kioskQ().length;
  const st=t=>t.on_leave&&!t.in_at?['lv','🌴 Leave']:t.out_at?['out','Out '+hhmm(t.out_at)]:t.in_at?['in','In '+hhmm(t.in_at)]:['no','Tap to check in'];

  <div class="ksgrid">${KS.list.map((t,i)=>{const [k,s]=st(t),c=T_COL[i%T_COL.length];return `<button class="kst ${k}" style="--k1:${c[0]};--k2:${c[1]}" onclick="kioskPick('${t.id}')" ${t.has_pin?'':'disabled'}>
    <span class="ksav">${esc(initials(t.name))}</span><b>${esc(t.name)}</b><small>${t.has_pin?s:'No PIN yet'}</small></button>`;}).join('')||'<div class="empty card" style="grid-column:1/-1">Loading teachers...</div>'}</div>
